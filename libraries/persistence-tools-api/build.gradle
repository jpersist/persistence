plugins {
    id 'library-conventions'
    id 'publishing-conventions'
}

tasks.named('jar', Jar) {
    manifest {
        attributes('Automatic-Module-Name': 'io.github.jpersist.tools.api')
    }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Persistence Tools API'
                description = 'Defines the public API and Service Provider Interfaces (SPI) for JPersist Persistence Tools.'
            }
        }
    }
}
