plugins {
    id 'library-conventions'
    id 'publishing-conventions'
}

dependencies {
    implementation project(':lint-persistence-api')
    compileOnly libs.hibernate.core

    testImplementation libs.hibernate.core
    testImplementation libs.javax.persistence.api
    testImplementation 'com.h2database:h2:1.4.200'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Legacy Lint Persistence'
                description = 'Legacy `javax.persistence` (JPA 2.x) provider. Uses Hibernate 5 and its AST-based query translator to validate JPQL queries and schemas.'
            }
        }
    }
}
