plugins {
    id 'library-conventions'
    id 'publishing-conventions'
}

dependencies {
    api project(':persistence-tools-api')
    api libs.hibernate.core

    testRuntimeOnly 'com.h2database:h2:1.4.200'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Legacy Persistence Tools'
                description = 'Legacy `javax.persistence` (JPA 2.x) provider'
            }
        }

        relocation(MavenPublication) {
            pom {
                // Old artifact coordinates
                groupId = 'io.github.jpersist.lint'
                artifactId = 'lint-persistence-legacy'
                version = project.version

                name = 'Legacy Lint Persistence'
                description = 'Legacy `javax.persistence` (JPA 2.x) provider. Uses Hibernate 5 and its AST-based query translator to validate JPQL queries and schemas.'

                distributionManagement {
                    relocation {
                        // New artifact coordinates
                        groupId = 'io.github.jpersist.tools'
                        artifactId = 'persistence-tools-legacy'
                        version = project.version
                        message = 'The JPersist Lint libraries have been renamed and relocated to align with the core tools ecosystem governance.'
                    }
                }
            }
        }
    }
}
