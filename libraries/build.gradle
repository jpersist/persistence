plugins {
    id("base")
    id("test-report-aggregation")
    id("jacoco-report-aggregation")
    id("org.sonarqube") version "7.5.0.8588"
}

dependencies {
    testReportAggregation project(':persistence-tools-api')
    testReportAggregation project(':hibernate-persistence-tools')
    testReportAggregation project(':hibernate-orm-persistence-tools')
}

configurations.jacocoAggregation.extendsFrom(configurations.testReportAggregation)

allprojects {
    repositories {
        mavenCentral()
    }
}

reporting {
    reports {
        testAggregateTestReport(AggregateTestReport) {
            testSuiteName = "test"
        }
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = "test"
        }
    }
}

tasks.named('check') {
    finalizedBy tasks.named('testAggregateTestReport', TestReport)
    finalizedBy tasks.named('testCodeCoverageReport', JacocoReport)
}

sonar {
    properties {
        property "sonar.projectKey", "jpersist_persistence_libraries"
        property "sonar.organization", "jpersist"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.projectName", "persistence-libraries"

        property "sonar.coverage.jacoco.xmlReportPaths", "${project.layout.buildDirectory.get().asFile}/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
    }
}

// 🌟 REUSABLE TYPE-SAFE JPMS JAVADOC CONFIGURATION HELPER
// Configures independent, native modular Javadoc for each project node.
void configureModularJavadoc(Javadoc task, List<Project> targetProjects, Project apiProject, String docTitle, String windowTitle, String destSubFolder) {
    task.group = 'documentation'

    // Ensure bytecode compilation is complete across all target modules before documenting
    task.dependsOn targetProjects.collect { it.tasks.named('classes') }

    // Aggregate sources and compile classpaths from all included projects
    task.source = files(targetProjects.collect { it.sourceSets.main.allJava })
    task.classpath = files(targetProjects.collect { it.sourceSets.main.compileClasspath })

    // Enforce Gradle's native JPMS path inference for strict module-path documentation
    task.modularity.inferModulePath = true

    // Separate output targets to prevent workspace overlap
    task.destinationDir = file("${buildDir}/docs/javadoc/${destSubFolder}")

    // Use the target project (the last one in the list) to resolve overview.html
    def targetProject = targetProjects.last()
    def currentYear = java.time.Year.now().toString()
    def moduleVersion = targetProject.version.toString()

    task.options {
        overview = targetProject.file("src/docs/overview.html")
        encoding = 'UTF-8'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'

        task.options.docTitle = docTitle
        task.options.windowTitle = windowTitle

        // Force native HTML5 compilation structure (enables the "Modules" tab and graphs)
        addBooleanOption('html5', true)

        // Security bypass required for Java 13+ to allow the bottom JavaScript favicon injection
        addBooleanOption('-allow-script-in-comments', true)

        // Cross-reference link to the standard JDK 17 Platform APIs
        links('https://docs.oracle.com/en/java/javase/17/docs/api/')

        // Dynamic cross-reference link mapping for implementation modules
        if (targetProject.name != apiProject.name) {
            def useOnlineJavadoc = targetProject.findProperty('useOnlineJavadoc')
            boolean isOnline = useOnlineJavadoc != null ? (useOnlineJavadoc.toString().isEmpty() || useOnlineJavadoc.toString().toBoolean()) : (targetProject.hasProperty('useOnlineJavadoc'))

            if (isOnline) {
                // Allows implementation Javadoc to safely hyperlink back to online core API definitions
                def apiVersion = targetProject.findProperty('releasedApiVersion') ?: apiProject.version.toString()
                links("https://jpersist.github.io/persistence/tools/specifications/api/${apiVersion}/")
            } else {
                File localDir = rootProject.layout.buildDirectory.dir("docs/javadoc/specifications").get().asFile
                if (localDir.exists()) {
                    links("${localDir.toURI().toString()}")
                }
            }
        }

        // Map module names to their physical source directories when documenting multiple modules together
        if (targetProjects.size() > 1) {
            def moduleMappings = [
                "io.github.jpersist.tools.hibernate.base=${project(':hibernate-base-persistence-tools').file('src/main/java')}".toString(),
                "io.github.jpersist.tools.hibernate=${project(':hibernate-persistence-tools').file('src/main/java')}".toString(),
                "io.github.jpersist.tools.hibernate.orm=${project(':hibernate-orm-persistence-tools').file('src/main/java')}".toString()
            ]
            // Filter mappings to only include modules present in targetProjects
            def activeMappings = moduleMappings.findAll { mapping ->
                targetProjects.any { proj -> mapping.contains(proj.name) }
            }
            addMultilineStringsOption('-module-source-path').value = activeMappings
        }

        // 1. HEADER: Inject a styled version badge in the top-right navigation bar
        header = "<div style='padding: 4px 10px; background: rgba(255,255,255,0.15); border-radius: 4px; font-weight: bold;'>JPersist Suite &bull; v${moduleVersion}</div>"

        // 2. FOOTER (BOTTOM): Dynamic copyright notice, Apache 2.0 license, GitHub link, and linearized SVG favicon script
        def footerHtml = "<div style='text-align: center; padding: 10px 0; color: #555; font-size: 0.9em;'>" +
            "Copyright &copy; 2024-${currentYear} <a href='https://github.com/jpersist/persistence' target='_blank'>JPersist Project</a>. " +
            "Licensed under the <a href='https://www.apache.org/licenses/LICENSE-2.0.txt' target='_blank'>Apache License, Version 2.0</a>." +
            "</div>"

        def faviconScript = '<script>document.addEventListener("DOMContentLoaded",function(){var links=document.getElementsByTagName("link");var hasFavicon=false;var relPrefix="";for(var i=0;i<links.length;i++){if(links[i].rel==="icon"||links[i].rel==="shortcut icon"){hasFavicon=true;}if(links[i].href&&links[i].href.indexOf("stylesheet.css")!==-1){var parts=links[i].getAttribute("href").split("stylesheet.css");if(parts.length>0){relPrefix=parts[0];}}}if(!hasFavicon){var link=document.createElement("link");link.rel="icon";link.type="image/svg+xml";link.href=relPrefix+"resources/favicon.svg";document.getElementsByTagName("head")[0].appendChild(link);}});</script>'

        bottom = "${footerHtml}${faviconScript}"

        // 3. CUSTOM CSS: Optional stylesheet override for corporate branding (Java 17+ native CSS variables)
        def stylesheet = file("${rootDir}/src/docs/resources/jpersist.css")
        if (stylesheet.exists()) {
            addStringOption('-add-stylesheet', stylesheet.absolutePath)
        }
    }

    // Copy the raw SVG favicon into the dedicated project target documentation directory
    task.doLast {
        copy {
            from "${rootDir}/src/docs/resources/favicon.svg"
            into "${task.destinationDir}/resources"
        }
    }
}

// ------------------------------------------------------------------------------------------------
// INDEPENDENT MODULAR JAVADOC TASKS DEFINITIONS
// ------------------------------------------------------------------------------------------------

def apiProject = project(':persistence-tools-api')
def hibernateBaseProject = project(':hibernate-base-persistence-tools')

// 1. Core API Module Javadoc (Fully Modular / No external dependencies)
tasks.register('aggregateApiJavadoc', Javadoc) {
    description = 'Generates native modular JPMS Javadoc for the core vendor-agnostic API module.'
    configureModularJavadoc(it, [project(':persistence-tools-api')], apiProject, 'JPersist Persistence Tools Core API Reference', 'JPersist Tools API', 'specifications')
}

// 2. Hibernate Legacy Module Javadoc (Modular / Bound to Hibernate 5 & javax)
tasks.register('aggregateLegacyHibernateJavadoc', Javadoc) {
    description = 'Generates native modular JPMS Javadoc for the Hibernate 5 Legacy reference implementation.'
    configureModularJavadoc(it, [hibernateBaseProject, project(':hibernate-persistence-tools')], apiProject, 'JPersist Persistence Tools - Hibernate 5 Core Reference', 'JPersist Tools - Hibernate 5', 'hibernate')
}

// 3. Hibernate Modern Module Javadoc (Modular / Bound to Hibernate 6 & jakarta)
tasks.register('aggregateModernHibernateJavadoc', Javadoc) {
    description = 'Generates native modular JPMS Javadoc for the Hibernate 6 Modern reference implementation.'
    configureModularJavadoc(it, [hibernateBaseProject, project(':hibernate-orm-persistence-tools')], apiProject, 'JPersist Persistence Tools - Hibernate 6 ORM Reference', 'JPersist Tools - Hibernate 6', 'hibernate-orm')
}

// ------------------------------------------------------------------------------------------------
// LIFECYCLE PIPELINE AGGREGATION
// ------------------------------------------------------------------------------------------------

tasks.register('aggregateAllJavadocs') {
    group = 'documentation'
    description = 'Executes all three independent modular Javadoc generation tasks concurrently.'

    // Bind dependencies to trigger execution of all three standalone targets
    dependsOn tasks.named('aggregateApiJavadoc')
    dependsOn tasks.named('aggregateLegacyHibernateJavadoc')
    dependsOn tasks.named('aggregateModernHibernateJavadoc')
}

// 🌟 SEQUENTIAL EXECUTION ENFORCEMENT
// Ensures that Hibernate Javadoc builds strictly execute AFTER the API Javadoc
// has finished its compilation and asset lifecycle steps.
tasks.named('aggregateLegacyHibernateJavadoc') {
    mustRunAfter tasks.named('aggregateApiJavadoc')
}

tasks.named('aggregateModernHibernateJavadoc') {
    mustRunAfter tasks.named('aggregateApiJavadoc')
}
