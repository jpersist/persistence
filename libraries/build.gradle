plugins {
    id("base")
    id("test-report-aggregation")
    id("jacoco-report-aggregation")
    id("org.sonarqube") version "7.5.0.8588"
}

dependencies {
    testReportAggregation project(':persistence-tools-api')
    testReportAggregation project(':persistence-tools-jakarta')
    testReportAggregation project(':persistence-tools-legacy')
}

configurations.jacocoAggregation.extendsFrom(configurations.testReportAggregation)

// 1. Define a dedicated configuration for module aggregation at the very top of your root file
configurations {
    javadocAggregation {
        canBeConsumed = false
        canBeResolved = true
    }
}

// 2. Add your subprojects as non-transitive dependencies
dependencies {
    javadocAggregation(project(':persistence-tools-api')) { transitive = false }
    javadocAggregation(project(':persistence-tools-jakarta')) { transitive = false }
    javadocAggregation(project(':persistence-tools-legacy')) { transitive = false }
}

allprojects {
    repositories {
        mavenCentral()
    }
}

reporting {
    reports {
        testAggregateTestReport(AggregateTestReport) {
            testSuiteName = "test"
        }
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = "test"
        }
    }
}

tasks.named('check') {
    finalizedBy tasks.named('testAggregateTestReport', TestReport)
    finalizedBy tasks.named('testCodeCoverageReport', JacocoReport)
}

sonar {
    properties {
        property "sonar.projectKey", "jpersist_persistence_libraries"
        property "sonar.organization", "jpersist"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.projectName", "persistence-libraries"

        property "sonar.coverage.jacoco.xmlReportPaths", "${project.layout.buildDirectory.get().asFile}/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
    }
}

tasks.register('aggregateJavadoc', Javadoc) {
    group = 'documentation'
    description = 'Generates aggregated Javadoc for all library modules with flat classpath fallback.'
    title = "Persistence Tools Libraries API"

    def javaSubprojects = subprojects.findAll { it.plugins.hasPlugin('java-library') }
    dependsOn javaSubprojects.collect { it.tasks.named('classes') }

    // 1. CLASSPATH WORKAROUND - SOURCE FILTERING:
    // Explicitly target all source sets but exclude 'module-info.java' descriptors.
    // This forces the Javadoc compiler to build in a clean, non-modular environment.
    def allSources = javaSubprojects.collect { it.sourceSets.main.allJava }
    source = files(allSources).asFileTree.matching {
        exclude 'module-info.java'
    }

    // 2. CLASSPATH WORKAROUND - DEPENDENCY FLATTENING:
    // Gather all module classpaths and place them on the standard flat classpath.
    // Explicitly disable Gradle's native JPMS path inference to completely eliminate
    // the automatic module naming collision between Hibernate 5 and Hibernate 6.
    classpath = files(javaSubprojects.collect { it.sourceSets.main.compileClasspath })

    modularity.inferModulePath = false

    // Set the output directory
    destinationDir = file("${buildDir}/docs/javadoc")

    options {
        overview = file("${rootDir}/src/docs/overview.html")
        encoding = 'UTF-8'
        docTitle = 'JPersist Persistence Tools Libraries API Reference'
        windowTitle = 'JPersist Persistence Tools API'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'

        // Enable modern HTML5 rendering with the "Modules" search bar
        addBooleanOption('html5', true)

        // Link to external JDK 17 docs
        links('https://docs.oracle.com/en/java/javase/17/docs/api/')
    }
}

tasks.register('aggregateJavadocJakarta', Javadoc) {
    group = 'documentation'
    description = 'Generates aggregated modular Javadoc for the Jakarta/Hibernate 6 ecosystem.'
    title = "Persistence Tools Libraries API (Jakarta Suite)"

    def targetProjects = [project(':persistence-tools-api'), project(':persistence-tools-jakarta')]
    dependsOn targetProjects.collect { it.tasks.named('classes') }

    source = files(targetProjects.collect { it.sourceSets.main.allJava })
    classpath = files(targetProjects.collect { it.sourceSets.main.compileClasspath })

    destinationDir = file("${buildDir}/docs/javadoc/jakarta")

    options {
        overview = file("${rootDir}/src/docs/overview.html")
        encoding = 'UTF-8'
        docTitle = 'JPersist Persistence Tools Libraries API Reference (Jakarta Suite)'
        windowTitle = 'JPersist Persistence Tools API - Jakarta'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'

        // Enable modern HTML5 rendering with the "Modules" search bar
        addBooleanOption('html5', true)

        // Module source path mappings for multi-module JPMS Javadoc
        addMultilineStringsOption('-module-source-path').value = [
            "io.github.jpersist.tools.api=${project(':persistence-tools-api').file('src/main/java')}".toString(),
            "io.github.jpersist.tools.jakarta=${project(':persistence-tools-jakarta').file('src/main/java')}".toString()
        ]

        // Link to external JDK 17 docs
        links('https://docs.oracle.com/en/java/javase/17/docs/api/')
    }
}

