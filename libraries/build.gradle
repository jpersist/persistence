plugins {
    id("base")
}

allprojects {
    repositories {
        mavenCentral()
    }
}

subprojects { subproject ->
    apply plugin: 'maven-publish'
    apply plugin: 'signing'

    plugins.withType(JavaPlugin).configureEach {
        java {
            toolchain {
                languageVersion = JavaLanguageVersion.of(17)
            }
        }
    }

    tasks.withType(JavaCompile).configureEach {
        options.encoding = 'UTF-8'
        options.release = 17
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
        systemProperty 'file.encoding', 'UTF-8'
    }

    tasks.withType(Sign).configureEach {
        onlyIf { !version.endsWith('SNAPSHOT') }
    }

    publishing {
        publications {
            maven(MavenPublication) {
                pom {
                    url = 'https://github.com/jpersist/persistence'

                    licenses {
                        license {
                            name = 'The Apache License, Version 2.0'
                            url = 'http://www.apache.org/licenses/LICENSE-2.0.txt'
                        }
                    }

                    developers {
                        developer {
                            id = 'yannickebongue'
                            name = 'Yannick Ebongue'
                            email = 'yannickebongue@gmail.com'
                        }
                    }

                    scm {
                        url = 'https://github.com/jpersist/persistence'
                        connection = 'scm:git:git@github.com:jpersist/persistence.git'
                        developerConnection = 'scm:git:git@github.com:jpersist/persistence.git'
                    }
                }
            }
        }

        repositories {
            maven {
                def releaseRepoUrl = 'https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/'
                def snapshotRepoUrl = 'https://central.sonatype.com/repository/maven-snapshots/'

                name = 'MavenCentral'
                url = version.endsWith('SNAPSHOT') ? snapshotRepoUrl : releaseRepoUrl

                credentials {
                    username = findProperty('ossrhUsername') ?: System.getenv('OSSRH_USERNAME')
                    password = findProperty('ossrhPassword') ?: System.getenv('OSSRH_PASSWORD')
                }
            }
        }
    }

    signing {
        def signingKey = findProperty("signingKey")
        def signingPassword = findProperty("signingPassword")
        useInMemoryPgpKeys(signingKey, signingPassword)
        sign publishing.publications.maven
    }
}
