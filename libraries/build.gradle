plugins {
    id("base")
    id("test-report-aggregation")
    id("jacoco-report-aggregation")
    id("org.sonarqube") version "7.5.0.8588"
}

dependencies {
    testReportAggregation project(':persistence-tools-api')
    testReportAggregation project(':hibernate-persistence-tools')
    testReportAggregation project(':hibernate-orm-persistence-tools')
}

configurations.jacocoAggregation.extendsFrom(configurations.testReportAggregation)

allprojects {
    repositories {
        mavenCentral()
    }
}

reporting {
    reports {
        testAggregateTestReport(AggregateTestReport) {
            testSuiteName = "test"
        }
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = "test"
        }
    }
}

tasks.named('check') {
    finalizedBy tasks.named('testAggregateTestReport', TestReport)
    finalizedBy tasks.named('testCodeCoverageReport', JacocoReport)
}

sonar {
    properties {
        property "sonar.projectKey", "jpersist_persistence_libraries"
        property "sonar.organization", "jpersist"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.projectName", "persistence-libraries"

        property "sonar.coverage.jacoco.xmlReportPaths", "${project.layout.buildDirectory.get().asFile}/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
    }
}

// 🌟 REUSABLE JAVADOC CONFIGURATION HELPER
// Extracts shared configurations, HTML5 options, custom vector SVG favicon injections,
// and post-build copy actions into a single maintainable routine.
void configureSharedJavadoc(Javadoc task, String docTitle, String windowTitle, String relativeDestPath) {
    task.group = 'documentation'

    // Wire up common doclet output locations
    task.destinationDir = file("${buildDir}/docs/javadoc/${relativeDestPath}")

    task.options {
        overview = file("${rootDir}/src/docs/overview.html")
        encoding = 'UTF-8'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'

        task.options.docTitle = docTitle
        task.options.windowTitle = windowTitle

        // Force native HTML5 compilation structure
        addBooleanOption('html5', true)

        // 🌟 CRITICAL SECURITY FIX FOR JAVA 13+
        // Explicitly allows the use of JavaScript within Javadoc comments and options (like -bottom)
        // to bypass the "error: option -bottom contains JavaScript" compilation failure.
        addBooleanOption('-allow-script-in-comments', true)

        // Bind core JDK documentation reference maps
        links('https://docs.oracle.com/en/java/javase/17/docs/api/')

        // INJECT CUSTOM SVG FAVICON via -bottom EXECUTION HOOK
        // Injects a lightweight responsive inline observer script to bind the high-integrity
        // vector graphic directly inside the active HTML <head> node across compiled views.
        bottom = """
        <script>
            document.addEventListener("DOMContentLoaded", function() {
                var links = document.getElementsByTagName('link');
                var hasFavicon = false;
                for (var i = 0; i < links.length; i++) {
                    if (links[i].rel === 'icon' || links[i].rel === 'shortcut icon') {
                        hasFavicon = true;
                        break;
                    }
                }
                if (!hasFavicon) {
                    var link = document.createElement('link');
                    link.rel = 'icon';
                    link.type = 'image/svg+xml';
                    link.href = 'resources/favicon.svg';
                    document.getElementsByTagName('head')[0].appendChild(link);
                }
            });
        </script>
        """
    }

    // DISCOVERY HOOK: Automate static asset copies into target distribution directories
    task.doLast {
        copy {
            from "${rootDir}/src/docs/resources/favicon.svg"
            into "${task.destinationDir}/resources"
        }
    }
}

// ------------------------------------------------------------------------------------------------
// JAVADOC AGGREGATION TASKS DEFINITIONS
// ------------------------------------------------------------------------------------------------

tasks.register('aggregateJavadoc', Javadoc) {
    description = 'Generates aggregated Javadoc for all library modules with flat classpath fallback.'

    def javaSubprojects = subprojects.findAll { it.plugins.hasPlugin('java-library') }
    dependsOn javaSubprojects.collect { it.tasks.named('classes') }

    // Strip module-info.java descriptors to avoid compilation path pollution on a flat model
    source = files(javaSubprojects.collect { it.sourceSets.main.allJava }).asFileTree.matching {
        exclude 'module-info.java'
    }

    classpath = files(javaSubprojects.collect { it.sourceSets.main.compileClasspath })
    modularity.inferModulePath = false

    // Apply corporate styling conventions through our shared helper logic
    configureSharedJavadoc(it, 'JPersist Persistence Tools Libraries API Reference', 'JPersist Persistence Tools API', '')
}

tasks.register('aggregateJavadocJakarta', Javadoc) {
    description = 'Generates aggregated modular Javadoc for the Jakarta/Hibernate 6 ecosystem.'

    def targetProjects = [project(':persistence-tools-api'), project(':hibernate-orm-persistence-tools')]
    dependsOn targetProjects.collect { it.tasks.named('classes') }

    source = files(targetProjects.collect { it.sourceSets.main.allJava })
    classpath = files(targetProjects.collect { it.sourceSets.main.compileClasspath })

    options {
        // Enforce exact module source mappings for strict multi-module isolation
        addMultilineStringsOption('-module-source-path').value = [
            "io.github.jpersist.tools.api=${project(':persistence-tools-api').file('src/main/java')}".toString(),
            "io.github.jpersist.tools.jakarta=${project(':hibernate-orm-persistence-tools').file('src/main/java')}".toString()
        ]
    }

    configureSharedJavadoc(it, 'JPersist Persistence Tools Libraries API Reference (Jakarta Suite)', 'JPersist Persistence Tools API - Jakarta', 'jakarta')
}

tasks.register('aggregateJavadocLegacy', Javadoc) {
    description = 'Generates aggregated modular Javadoc for the Legacy/Hibernate 5 ecosystem.'

    def targetProjects = [project(':persistence-tools-api'), project(':hibernate-persistence-tools')]
    dependsOn targetProjects.collect { it.tasks.named('classes') }

    source = files(targetProjects.collect { it.sourceSets.main.allJava })
    classpath = files(targetProjects.collect { it.sourceSets.main.compileClasspath })

    options {
        // Enforce exact module source mappings for strict multi-module isolation
        addMultilineStringsOption('-module-source-path').value = [
            "io.github.jpersist.tools.api=${project(':persistence-tools-api').file('src/main/java')}".toString(),
            "io.github.jpersist.tools.legacy=${project(':hibernate-persistence-tools').file('src/main/java')}".toString()
        ]
    }

    configureSharedJavadoc(it, 'JPersist Persistence Tools Libraries API Reference (Legacy Suite)', 'JPersist Persistence Tools API - Legacy', 'legacy')
}

// 🌟 LIFECYCLE AGGREGATION TASK
// Groups all documentation pipelines (Global Flat, Modular Jakarta, and Modular Legacy)
// under a single execution shortcut task: ./gradlew aggregateAllJavadocs
tasks.register('aggregateAllJavadocs') {
    group = 'documentation'
    description = 'Executes all three Javadoc generation pipelines sequentially (Flat first, then Modular versions).'

    // Bind dependencies to trigger execution of all three variant targets automatically
    dependsOn tasks.named('aggregateJavadoc')
    dependsOn tasks.named('aggregateJavadocJakarta')
    dependsOn tasks.named('aggregateJavadocLegacy')
}

// 🌟 SEQUENTIAL EXECUTION ENFORCEMENT
// Ensures that modular Javadoc builds strictly execute AFTER the global flat classpath Javadoc
// has finished its compilation and asset lifecycle steps.
tasks.named('aggregateJavadocJakarta') {
    mustRunAfter tasks.named('aggregateJavadoc')
}

tasks.named('aggregateJavadocLegacy') {
    mustRunAfter tasks.named('aggregateJavadoc')
}
