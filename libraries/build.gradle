plugins {
    id("base")
    id("test-report-aggregation")
    id("jacoco-report-aggregation")
    id("org.sonarqube") version "7.5.0.8588"
}

dependencies {
    testReportAggregation project(':persistence-tools-api')
    testReportAggregation project(':hibernate-persistence-tools')
    testReportAggregation project(':hibernate-orm-persistence-tools')
}

configurations.jacocoAggregation.extendsFrom(configurations.testReportAggregation)

allprojects {
    repositories {
        mavenCentral()
    }
}

reporting {
    reports {
        testAggregateTestReport(AggregateTestReport) {
            testSuiteName = "test"
        }
        testCodeCoverageReport(JacocoCoverageReport) {
            testSuiteName = "test"
        }
    }
}

tasks.named('check') {
    finalizedBy tasks.named('testAggregateTestReport', TestReport)
    finalizedBy tasks.named('testCodeCoverageReport', JacocoReport)
}

sonar {
    properties {
        property "sonar.projectKey", "jpersist_persistence_libraries"
        property "sonar.organization", "jpersist"
        property "sonar.host.url", "https://sonarcloud.io"
        property "sonar.projectName", "persistence-libraries"

        property "sonar.coverage.jacoco.xmlReportPaths", "${project.layout.buildDirectory.get().asFile}/reports/jacoco/testCodeCoverageReport/testCodeCoverageReport.xml"
    }
}

// 🌟 REUSABLE TYPE-SAFE JPMS JAVADOC CONFIGURATION HELPER
// Configures independent, native modular Javadoc for each project node.
void configureModularJavadoc(Javadoc task, Project targetProject, Project apiProject, String docTitle, String windowTitle, String destSubFolder) {
    task.group = 'documentation'

    // Ensure bytecode compilation is complete before documenting
    task.dependsOn targetProject.tasks.named('classes')

    // Native JPMS mapping: compile directly against the project source set
    task.source = targetProject.sourceSets.main.allJava
    task.classpath = targetProject.sourceSets.main.compileClasspath

    // Enforce Gradle's native JPMS path inference for strict module-path documentation
    task.modularity.inferModulePath = true

    // Separate output targets to prevent workspace overlap
    task.destinationDir = file("${buildDir}/docs/javadoc/${destSubFolder}")

    task.options {
        overview = targetProject.file("src/docs/overview.html")
        encoding = 'UTF-8'
        docEncoding = 'UTF-8'
        charSet = 'UTF-8'

        task.options.docTitle = docTitle
        task.options.windowTitle = windowTitle

        // Force native HTML5 compilation structure (enables the "Modules" tab and graphs)
        addBooleanOption('html5', true)

        // Security bypass required for Java 13+ to allow the bottom JavaScript favicon injection
        addBooleanOption('-allow-script-in-comments', true)

        // Cross-reference link to the standard JDK 17 Platform APIs
        links('https://docs.oracle.com/en/java/javase/17/docs/api/')

        // Dynamic cross-reference link mapping for implementation modules
        if (targetProject.name != apiProject.name) {
            try {
                // Allows implementation Javadoc to safely hyperlink back to core API definitions
                def apidocLink = "https://jpersist.github.io/persistence/libraries/api/${apiProject.version}/"
                def url = URI.create(apidocLink).toURL()
                def connection = (HttpURLConnection) url.openConnection()
                connection.requestMethod = "HEAD"
                connection.connectTimeout = 3000 // Timeout de 3 secondes
                connection.readTimeout = 3000

                int responseCode = connection.responseCode
                if (responseCode != HttpURLConnection.HTTP_OK) {
                    throw new Exception("The remote URL returns: ${responseCode}")
                }
                links(apidocLink)
            } catch (Exception ignored) {
                File localDir = rootProject.layout.buildDirectory.dir("docs/javadoc/api").get().asFile
                if (localDir.exists()) {
                    links("${localDir.toURI().toString()}")
                }
            }
        }

        // 🌟 FIXED & LINEARIZED JAVADOC INTEGRATION WITH CUSTOM SVG FAVICON via -bottom FLAG
        // The script is compressed onto a single line to guarantee seamless compatibility inside 'javadoc.options'.
        // It dynamically inspects the existing Javadoc stylesheet link to extract the accurate relative prefix location.
        bottom = '<script>document.addEventListener("DOMContentLoaded",function(){var links=document.getElementsByTagName("link");var hasFavicon=false;var relPrefix="";for(var i=0;i<links.length;i++){if(links[i].rel==="icon"||links[i].rel==="shortcut icon"){hasFavicon=true;}if(links[i].href&&links[i].href.indexOf("stylesheet.css")!==-1){var parts=links[i].getAttribute("href").split("stylesheet.css");if(parts.length>0){relPrefix=parts[0];}}}if(!hasFavicon){var link=document.createElement("link");link.rel="icon";link.type="image/svg+xml";link.href=relPrefix+"resources/favicon.svg";document.getElementsByTagName("head")[0].appendChild(link);}});</script>'
    }

    // Copy the raw SVG favicon into the dedicated project target documentation directory
    task.doLast {
        copy {
            from "${rootDir}/src/docs/resources/favicon.svg"
            into "${task.destinationDir}/resources"
        }
    }
}

// ------------------------------------------------------------------------------------------------
// INDEPENDENT MODULAR JAVADOC TASKS DEFINITIONS
// ------------------------------------------------------------------------------------------------

def apiProject = project(':persistence-tools-api')

// 1. Core API Module Javadoc (Fully Modular / No external dependencies)
tasks.register('aggregateApiJavadoc', Javadoc) {
    description = 'Generates native modular JPMS Javadoc for the core vendor-agnostic API module.'
    configureModularJavadoc(it, project(':persistence-tools-api'), apiProject, 'JPersist Persistence Tools Core API Reference', 'JPersist Tools API', 'api')
}

// 2. Hibernate Legacy Module Javadoc (Modular / Bound to Hibernate 5 & javax)
tasks.register('aggregateLegacyHibernateJavadoc', Javadoc) {
    description = 'Generates native modular JPMS Javadoc for the Hibernate 5 Legacy reference implementation.'
    configureModularJavadoc(it, project(':hibernate-persistence-tools'), apiProject, 'JPersist Persistence Tools - Hibernate 5 Core Reference', 'JPersist Tools - Hibernate 5', 'hibernate-legacy')
}

// 3. Hibernate Modern Module Javadoc (Modular / Bound to Hibernate 6 & jakarta)
tasks.register('aggregateModernHibernateJavadoc', Javadoc) {
    description = 'Generates native modular JPMS Javadoc for the Hibernate 6 Modern reference implementation.'
    configureModularJavadoc(it, project(':hibernate-orm-persistence-tools'), apiProject, 'JPersist Persistence Tools - Hibernate 6 ORM Reference', 'JPersist Tools - Hibernate 6', 'hibernate-modern')
}

// ------------------------------------------------------------------------------------------------
// LIFECYCLE PIPELINE AGGREGATION
// ------------------------------------------------------------------------------------------------

tasks.register('aggregateAllJavadocs') {
    group = 'documentation'
    description = 'Executes all three independent modular Javadoc generation tasks concurrently.'

    // Bind dependencies to trigger execution of all three standalone targets
    dependsOn tasks.named('aggregateApiJavadoc')
    dependsOn tasks.named('aggregateLegacyHibernateJavadoc')
    dependsOn tasks.named('aggregateModernHibernateJavadoc')
}

// 🌟 SEQUENTIAL EXECUTION ENFORCEMENT
// Ensures that Hibernate Javadoc builds strictly execute AFTER the API Javadoc
// has finished its compilation and asset lifecycle steps.
tasks.named('aggregateLegacyHibernateJavadoc') {
    mustRunAfter tasks.named('aggregateApiJavadoc')
}

tasks.named('aggregateModernHibernateJavadoc') {
    mustRunAfter tasks.named('aggregateApiJavadoc')
}
