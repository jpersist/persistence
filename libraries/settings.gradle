pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'com.gradle.develocity' version '4.6.0'
}

develocity {
    buildScan {
        publishing.onlyIf { System.getenv('CI') != null }

        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
    }
}

rootProject.name = "libraries"

include("lint-persistence-api")
include("lint-persistence-jakarta")
include("lint-persistence-legacy")

include("lint-persistence-bom")
