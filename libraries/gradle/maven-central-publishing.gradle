apply plugin: 'maven-publish'
apply plugin: 'signing'

// 1. Automatically generate Source and Javadoc JARs required by Maven Central
plugins.withType(JavaPlugin).configureEach {
    java {
        withSourcesJar()
        withJavadocJar()
    }
}

tasks.withType(Sign).configureEach {
    onlyIf { !version.endsWith('SNAPSHOT') }
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            // Metadata required by Sonatype/Maven Central compliance
            pom {
                name = project.name
                description = 'Modern, cache-compliant Gradle tooling for Jakarta Persistence API frameworks.'
                url = 'https://github.com/jpersist/persistence'

                licenses {
                    license {
                        name = 'The Apache License, Version 2.0'
                        url = 'https://apache.org'
                    }
                }

                developers {
                    developer {
                        id = 'yannickebongue'
                        name = 'Yannick Ebongue'
                        email = 'yannickebongue@gmail.com'
                    }
                }

                scm {
                    connection = 'scm:git:git@github.com:jpersist/persistence.git'
                    developerConnection = 'scm:git:git@github.com:jpersist/persistence.git'
                    url = 'https://github.com/jpersist/persistence'
                }
            }
        }
    }

    repositories {
        maven {
            name = "MavenCentral"
            // Toggle between Release and Snapshot repositories dynamically
            def releasesRepoUrl = "https://ossrh-staging-api.central.sonatype.com/service/local/staging/deploy/maven2/"
            def snapshotsRepoUrl = "https://central.sonatype.com/repository/maven-snapshots/"
            url = version.endsWith('SNAPSHOT') ? snapshotsRepoUrl : releasesRepoUrl

            credentials {
                username = providers.environmentVariable("SONATYPE_USERNAME").orElse("").get()
                password = providers.environmentVariable("SONATYPE_PASSWORD").orElse("").get()
            }
        }
    }
}

// Wait for the JavaPlugin to be applied before extracting and binding the component metadata.
// This guarantees your compiled jars, sources, and javadocs are attached to the publication seamlessly!
plugins.withType(JavaPlugin).configureEach {
    publishing.publications.named('mavenJava', MavenPublication).configure {
        versionMapping {
            usage('java-api') {
                fromResolutionOf('runtimeClasspath')
            }
            usage('java-runtime') {
                fromResolutionResult()
            }
        }
    }
}

// 2. Cryptographically sign the artifacts using GPG (Only mandatory for full Releases)
signing {
    required { !version.endsWith("SNAPSHOT") && gradle.taskGraph.hasTask("publish") }
    def signingKey = providers.environmentVariable("GPG_SIGNING_KEY").orElse("").get()
    def signingPassword = providers.environmentVariable("GPG_SIGNING_PASSWORD").orElse("").get()

    useInMemoryPgpKeys(signingKey, signingPassword)
    sign publishing.publications.mavenJava
}
