plugins {
    id 'java-library'
    id 'jacoco'
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    testImplementation 'org.assertj:assertj-core:3.27.3'
}

java {
    modularity.inferModulePath = true

    withSourcesJar()
    withJavadocJar()

    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 17
}

tasks.withType(Jar).configureEach {
    def metadata = [
        'persistence-tools-api': [ title: 'Persistence Tools Core Specification', version: '4.0' ],
        'hibernate-persistence-tools': [ title: 'JPA 2.x Legacy Persistence Specification Bridge', version: '2.2' ],
        'hibernate-orm-persistence-tools': [ title: 'JPA 3.x Jakarta Persistence Specification Bridge', version: '3.1' ],
        'hibernate-base-persistence-tools': [ title: 'Hibernate Persistence Tools Core Foundation', version: '1.0' ]
    ]

    def spec = metadata[project.name] ?: [ title: 'Persistence Tools Module', version: '4.0' ]
    def specTitle = spec.title
    def specVersion = spec.version

    manifest {
        attributes(
            // 🌟 Standard Package Specification Metadata
            'Specification-Title': specTitle,
            'Specification-Version': specVersion,
            'Specification-Vendor': 'JPersist Project',

            // 🌟 Standard Package Implementation Metadata
            'Implementation-Title': project.name,
            'Implementation-Version': project.version.toString(),
            'Implementation-Vendor': 'JPersist',

            // 🌟 OSGi Architecture Compatibility Attributes
            'Bundle-SymbolicName': "io.github.jpersist.tools.${project.name.replaceAll('-', '.')}",
            'Bundle-Name': specTitle,
            'Bundle-Vendor': 'JPersist',
            'Bundle-Version': project.version.toString().replaceAll('-SNAPSHOT', '.SNAPSHOT')
        )
    }
}

tasks.withType(Test).configureEach {
    useJUnitPlatform()
    finalizedBy tasks.named('jacocoTestReport')
    systemProperty 'file.encoding', 'UTF-8'
}

tasks.withType(JacocoReport).configureEach {
    dependsOn test
    reports {
        csv.required = false
        xml.required = true
    }
}
