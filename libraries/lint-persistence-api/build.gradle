plugins {
    id 'library-conventions'
    id 'publishing-conventions'
}

publishing {
    publications {
        mavenJava(MavenPublication) {
            from components.java

            pom {
                name = 'Lint Persistence API'
                description = 'Defines the Service Provider Interface (SPI): `NamedObjectParser` and `NamedObjectParserFactory`'
            }
        }
    }
}
