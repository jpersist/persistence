plugins {
    id 'java-library'
    id 'io.github.jpersist.openjpa-persistence'
    id 'com.netflix.nebula.dependency-recommender' version '14.2.1'
}

dependencies {
    jpa 'org.apache.openjpa:openjpa'

    compileOnly 'jakarta.persistence:jakarta.persistence-api'
}

dependencyRecommendations {
    map recommendations: [
        'jakarta.persistence:jakarta.persistence-api' : '3.1.0',
        'org.apache.openjpa:openjpa'                  : '4.0.0'
    ]
}

openjpa {
    main {
        metamodel {
            logLevel = 'TRACE'
        }
        enhancement {
            addDefaultConstructor = true
            enforcePropertyRestrictions = false
        }
    }
}

repositories {
    mavenCentral()
}
