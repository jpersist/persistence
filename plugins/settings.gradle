pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'com.gradle.develocity' version '4.6.0'
}

develocity {
    buildScan {
        publishing.onlyIf { System.getenv('CI') != null }

        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
    }
}

dependencyResolutionManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
    versionCatalogs {
        // Expose the same version catalog used by the root build
        libs {
            from(files("../gradle/libs.versions.toml"))
        }
    }
}

rootProject.name = 'plugins'

// Include the individual plugin modules locally within this build scope
include 'eclipse-persistence-gradle-plugin'
include 'hibernate-persistence-gradle-plugin'
include 'jakarta-persistence-gradle-plugin'
include 'persistence-gradle-plugin-functional-test'

includeBuild '../libraries'
