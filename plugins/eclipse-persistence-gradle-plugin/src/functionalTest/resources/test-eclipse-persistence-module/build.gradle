plugins {
    id 'java-library'
    id 'io.github.jpersist.eclipse-persistence'
    id 'com.netflix.nebula.dependency-recommender' version '12.2.0'
}

dependencyRecommendations {
    map recommendations: [
        'jakarta.persistence:jakarta.persistence-api': '3.1.0',
        'org.eclipse.persistence:org.eclipse.persistence.core': '4.0.9',
        'org.eclipse.persistence:org.eclipse.persistence.jpa': '4.0.9',
        'org.eclipse.persistence:org.eclipse.persistence.jpa.modelgen.processor': '4.0.9'
    ]
}

dependencies {
    compileOnlyApi 'jakarta.persistence:jakarta.persistence-api'

    implementation 'org.eclipse.persistence:org.eclipse.persistence.core'
}

eclipselink {
    main {
        jpaModelgen {
            persistenceXml = 'src/main/resources/META-INF/persistence.xml'
        }
    }
}

repositories {
    mavenCentral()
}
