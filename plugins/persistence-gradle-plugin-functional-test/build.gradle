plugins {
    id 'java-gradle-plugin'
    id 'groovy'
}

def submodules = rootProject.subprojects.findAll { it.name.endsWith('-gradle-plugin') }

dependencies {
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    submodules.forEach { implementation(it) }
}

test {
    useJUnitPlatform()
}

testing {
    suites {
        // Configure a functional test suite separate from standard unit tests
        functionalTest(JvmTestSuite) {
            dependencies {
                implementation gradleTestKit()

                // Set up Spock for functional testing across modules
                implementation libs.spock.core
            }

            targets {
                all {
                    testTask.configure {
                        // Ensure that when functional tests run, the plugin classpath is generated first
                        mustRunAfter(tasks.named('pluginUnderTestMetadata'))
                    }
                }
            }
        }
    }
}

// Map the custom test suite directly to the java-gradle-plugin lifecycle
// This tells Gradle to output the metadata necessary for `.withPluginClasspath()` to function
gradlePlugin {
    testSourceSets(sourceSets.functionalTest)
}

// Force the metadata task to include the outputs of your actual plugin subprojects
tasks.named('pluginUnderTestMetadata') {
    submodules.forEach { module ->
        def mainSourceSet = module.extensions.getByType(SourceSetContainer).named('main')
        pluginClasspath.from(mainSourceSet.map { it.output })
        pluginClasspath.from(module.configurations.named('runtimeClasspath'))
    }
}

tasks.named('check') {
    // Run the functional tests as part of `check`
    dependsOn testing.suites.functionalTest
}

sonar {
    properties {
        property "sonar.tests", "src/functionalTest/groovy"
    }
}
