plugins {
    id 'java-library'
    id 'io.github.jpersist.hibernate-persistence'
    id 'io.github.jpersist.persistence-platform'
}

dependencies {
    persistence platform('org.hibernate.orm:hibernate-platform:6.6.56.Final')

    implementation 'org.hibernate.orm:hibernate-core'
}

repositories {
    mavenCentral()
}
