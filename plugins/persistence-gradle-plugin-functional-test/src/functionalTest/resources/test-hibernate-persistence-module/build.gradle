plugins {
    id 'java-library'
    id 'io.github.jpersist.hibernate-persistence'
    id 'com.netflix.nebula.dependency-recommender' version '14.2.1'
}

dependencyRecommendations {
    mavenBom module: 'org.hibernate.orm:hibernate-platform:6.6.56.Final'
}

dependencies {
    implementation 'org.hibernate.orm:hibernate-core'
}

repositories {
    mavenCentral()
}
