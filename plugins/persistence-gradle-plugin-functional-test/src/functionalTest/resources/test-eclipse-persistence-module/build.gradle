plugins {
    id 'java-library'
    id 'io.github.jpersist.eclipse-persistence'
    id 'com.netflix.nebula.dependency-recommender' version '14.2.1'
}

dependencies {
    compileOnlyApi 'org.eclipse.persistence:jakarta.persistence'

    implementation 'org.eclipse.persistence:org.eclipse.persistence.jpa'
}

dependencyRecommendations {
    map recommendations: [
        'org.eclipse.persistence:org.eclipse.persistence.jpa' : '2.7.16',
        'org.eclipse.persistence:org.eclipse.persistence.jpa.modelgen.processor' : '2.7.16'
    ]
}

eclipselink {
    main {
        jpaModelgen {
            persistenceXml = 'src/main/resources/META-INF/persistence.xml'
        }
    }
}

repositories {
    mavenCentral()
}
