plugins {
    id 'java-library'
    id 'io.github.jpersist.eclipse-persistence'
    id 'com.netflix.nebula.dependency-recommender' version '14.2.1'
}

dependencyRecommendations {
    mavenBom module: 'org.eclipse.persistence:org.eclipse.persistence.parent:4.0.9'
}

dependencies {
    compileOnlyApi 'jakarta.persistence:jakarta.persistence-api'

    implementation 'org.eclipse.persistence:org.eclipse.persistence.core'
}

eclipselink {
    main {
        jpaModelgen {
            persistenceXml = 'src/main/resources/META-INF/persistence.xml'
        }
    }
}

repositories {
    mavenCentral()
}
