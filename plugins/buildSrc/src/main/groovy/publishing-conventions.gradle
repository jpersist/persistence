plugins {
    id 'com.gradle.plugin-publish'
}

gradlePlugin {
    website = 'https://github.com/jpersist/persistence'
    vcsUrl = 'https://github.com/jpersist/persistence.git'

    plugins.configureEach {
        compatibility(it) {
            features {
                configurationCache = true
                isolatedProjects = true
            }
        }
    }
}
