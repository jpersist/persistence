plugins {
    id 'jacoco'
}

jacoco {
    toolVersion = '0.8.12'
}

tasks.withType(JacocoReport).configureEach {
    reports {
        xml.required = true
        html.required = true
    }

    // Exclude JPA Metamodel classes from the report calculations
    classDirectories.setFrom(files(classDirectories.files.collect {
        fileTree(dir: it, exclude: [
            "**/*_.*",
            "**/persist/generated/**"
        ])
    }))
}
