plugins {
    id 'java-gradle-plugin'
    id 'groovy'
}

dependencies {
    implementation libs.hibernate.gradle.plugin
}

gradlePlugin {
    plugins {
        register('hibernateJpamodelgen') {
            id = 'io.github.jpersist.hibernate-jpamodelgen'
            implementationClass = 'persist.hibernate.gradle.plugin.HibernateJpamodelgenPlugin'
        }
        register('hibernatePersistence') {
            id = 'io.github.jpersist.hibernate-persistence'
            implementationClass = 'persist.hibernate.gradle.plugin.HibernatePersistencePlugin'
        }
    }
}
