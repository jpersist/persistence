name: Publish All Persistence Tools Libraries to Maven Central

on:
  push:
    tags:
      - 'libs-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: 'The unified release tag to checkout and publish (e.g., libs-v4.1.0)'
        required: false
        type: string
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      GPG_SIGNING_KEY:
        required: true
      GPG_SIGNING_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish All Library Packages from Tag
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository at Release Tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Maven Central Publication
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        working-directory: libraries
        run: |
          API_VER=$(grep '^version=' persistence-tools-api/gradle.properties | cut -d'=' -f2)
          BASE_VER=$(grep '^version=' hibernate-base-persistence-tools/gradle.properties | cut -d'=' -f2)
          HIB5_VER=$(grep '^version=' hibernate-persistence-tools/gradle.properties | cut -d'=' -f2)
          HIB6_VER=$(grep '^version=' hibernate-orm-persistence-tools/gradle.properties | cut -d'=' -f2)
          BOM_VER=$(grep '^version=' persistence-tools-bom/gradle.properties | cut -d'=' -f2)

          echo "Publishing unified release:"
          echo "  - persistence-tools-api:            ${API_VER}"
          echo "  - hibernate-base-persistence-tools: ${BASE_VER}"
          echo "  - hibernate-persistence-tools:      ${HIB5_VER}"
          echo "  - hibernate-orm-persistence-tools:  ${HIB6_VER}"
          echo "  - persistence-tools-bom:            ${BOM_VER}"

          ../gradlew publish

      - name: Finalize Maven Central Deployment
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          TOKEN=$(echo -n "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" | base64)
          curl --fail -X POST \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.jpersist?publishing_type=automatic" \
            -H "Authorization: Bearer ${TOKEN}"
