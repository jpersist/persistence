name: Publish Hibernate Persistence Tools to Maven Central

on:
  push:
    tags:
      - 'hibernate-v[0-9]+.[0-9]+.[0-9]+'
      - 'hibernate-orm-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish (e.g., hibernate-v1.0.0 or hibernate-orm-v2.0.0)'
        required: false
        type: string
      releasedApiVersion:
        description: 'Published Persistence Tools API version'
        required: false
        type: string
      releasedHibernateBaseVersion:
        description: 'Published Hibernate Base version'
        required: false
        type: string
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      GPG_SIGNING_KEY:
        required: true
      GPG_SIGNING_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Hibernate Provider Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Maven Central Publication
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        working-directory: libraries
        run: |
          ACTIVE_TAG="${{ inputs.tag }}"
          if [ -z "${ACTIVE_TAG}" ]; then
            ACTIVE_TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [[ "${ACTIVE_TAG}" == hibernate-orm-v* ]]; then
            MODULE="hibernate-orm-persistence-tools"
            PUBLISH_VERSION="${ACTIVE_TAG#hibernate-orm-v}"
          else
            MODULE="hibernate-persistence-tools"
            PUBLISH_VERSION="${ACTIVE_TAG#hibernate-v}"
          fi

          if [ -n "${{ inputs.releasedApiVersion }}" ]; then
            API_VERSION="${{ inputs.releasedApiVersion }}"
          else
            RAW_API=$(grep '^version=' gradle.properties | cut -d'=' -f2)
            API_VERSION="${RAW_API%-SNAPSHOT}"
          fi

          if [ -n "${{ inputs.releasedHibernateBaseVersion }}" ]; then
            BASE_VERSION="${{ inputs.releasedHibernateBaseVersion }}"
          else
            RAW_BASE=$(grep '^version=' hibernate-base-persistence-tools/gradle.properties | cut -d'=' -f2)
            BASE_VERSION="${RAW_BASE%-SNAPSHOT}"
          fi

          ../gradlew ":${MODULE}:publish" \
            -Pversion="${PUBLISH_VERSION}" \
            -PisHibernateRelease \
            -PreleasedApiVersion="${API_VERSION}" \
            -PreleasedHibernateBaseVersion="${BASE_VERSION}"

      - name: Finalize Maven Central Deployment
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          TOKEN=$(echo -n "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" | base64)
          curl --fail -X POST \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.jpersist?publishing_type=automatic" \
            -H "Authorization: Bearer ${TOKEN}"
