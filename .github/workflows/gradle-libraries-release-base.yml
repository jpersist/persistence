name: Trigger Hibernate Base Persistence Tools Release

on:
  workflow_dispatch:
    inputs:
      releasedApiVersion:
        description: 'Published Persistence Tools API version to link against (e.g., 4.0.0)'
        required: false
      releaseVersion:
        description: 'Target Release Version (e.g., 1.0.0)'
        required: false
      nextVersion:
        description: 'Next Snapshot Version (e.g., 1.0.1-SNAPSHOT)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-libraries
  cancel-in-progress: false

jobs:
  release:
    name: Execute Hibernate Base Release Automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}
      api_version: ${{ steps.context.outputs.api_version }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author Profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve Release and Next Versions
        id: versions
        run: |
          CURRENT_VERSION=$(grep '^version=' libraries/hibernate-base-persistence-tools/gradle.properties | cut -d'=' -f2)

          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.releaseVersion }}"
          else
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          fi

          if [ -n "${{ github.event.inputs.nextVersion }}" ]; then
            NEXT_VERSION="${{ github.event.inputs.nextVersion }}"
          else
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve Context and Dependency Versions
        id: context
        run: |
          if [ -n "${{ github.event.inputs.releasedApiVersion }}" ]; then
            API_VERSION="${{ github.event.inputs.releasedApiVersion }}"
          else
            API_TAG=$(git tag -l "api-v*" | sort -V | tail -n1)
            API_VERSION="${API_TAG#api-v}"
          fi

          if [ -z "${API_VERSION}" ]; then
            echo "::error::No existing 'api-v*' API release tag found and no releasedApiVersion input provided. Please release the API module first."
            exit 1
          fi

          echo "api_version=${API_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Set Release Version and Build
        working-directory: libraries
        run: |
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          API_VERSION="${{ steps.context.outputs.api_version }}"
          sed -i "s/^version=.*/version=${RELEASE_VERSION}/" hibernate-base-persistence-tools/gradle.properties
          ../gradlew :hibernate-base-persistence-tools:build -PisHibernateRelease -PreleasedApiVersion="${API_VERSION}"

      - name: Commit and Tag Release
        run: |
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          git add libraries/hibernate-base-persistence-tools/gradle.properties
          git commit -m "[Hibernate Base Release] - pre tag commit: '${RELEASE_VERSION}'."
          git tag -a "hibernate-base-v${RELEASE_VERSION}" -m "Hibernate Base Release hibernate-base-v${RELEASE_VERSION}"

      - name: Set Next Development Version
        run: |
          NEXT_VERSION="${{ steps.versions.outputs.next_version }}"
          sed -i "s/^version=.*/version=${NEXT_VERSION}/" libraries/hibernate-base-persistence-tools/gradle.properties
          git add libraries/hibernate-base-persistence-tools/gradle.properties
          git commit -m "[Hibernate Base Release] - new version commit: '${NEXT_VERSION}'."

      - name: Push Changes and Tag
        run: |
          git pull --rebase origin main
          git push origin main
          git push origin "hibernate-base-v${{ steps.versions.outputs.release_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: hibernate-base-v${{ steps.versions.outputs.release_version }}
          name: Hibernate Base Persistence Tools hibernate-base-v${{ steps.versions.outputs.release_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-base:
    name: Publish Hibernate Base to Maven Central
    needs: release
    uses: ./.github/workflows/gradle-libraries-cd-base.yml
    with:
      tag: hibernate-base-v${{ needs.release.outputs.release_version }}
      releasedApiVersion: ${{ needs.release.outputs.api_version }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
