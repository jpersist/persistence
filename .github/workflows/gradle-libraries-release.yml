name: Trigger Automated Libraries Release

on:
  workflow_dispatch:
    inputs:
      project_type:
        description: 'Select the project to release'
        required: true
        type: choice
        options:
          - API
          - BOM
          - HIBERNATE_LEGACY
          - HIBERNATE_MODERN
      releaseVersion:
        description: 'Target Release Version (e.g., 1.0.0, leave empty for auto)'
        required: false
      nextVersion:
        description: 'Next Snapshot Version (e.g., 1.0.1-SNAPSHOT)'
        required: false

permissions:
  contents: write

jobs:
  release:
    name: Execute Release Automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}
      tag_prefix: ${{ steps.context.outputs.tag_prefix }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author Profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@://github.com"

      - name: Resolve Project Context
        id: context
        run: |
          # Map selected project to its properties path, tag prefix, and compilation task
          case "${{ github.event.inputs.project_type }}" in
            API)
              PROP_PATH="libraries/gradle.properties"
              TAG_PREFIX="spec-v"
              BUILD_TASK=":persistence-tools-api:build"
              ;;
            BOM)
              PROP_PATH="libraries/persistence-tools-bom/gradle.properties"
              TAG_PREFIX="bom-v"
              BUILD_TASK=":persistence-tools-bom:build"
              ;;
            HIBERNATE_LEGACY)
              PROP_PATH="libraries/hibernate-persistence-tools/gradle.properties"
              TAG_PREFIX="hib5-v"
              BUILD_TASK=":hibernate-persistence-tools:build"
              ;;
            HIBERNATE_MODERN)
              PROP_PATH="libraries/hibernate-orm-persistence-tools/gradle.properties"
              TAG_PREFIX="hib6-v"
              BUILD_TASK=":hibernate-orm-persistence-tools:build"
              ;;
          esac

          echo "prop_path=${PROP_PATH}" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=${TAG_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "build_task=${BUILD_TASK}" >> "$GITHUB_OUTPUT"

      - name: Resolve Release and Next Versions
        id: versions
        run: |
          PROP_PATH="${{ steps.context.outputs.prop_path }}"

          # Initialize property file if it does not exist yet for the isolated BOM subfolder
          if [ ! -f "$PROP_PATH" ]; then
            echo "version=1.0.0-SNAPSHOT" > "$PROP_PATH"
          fi

          CURRENT_VERSION=$(grep '^version=' "$PROP_PATH" | cut -d'=' -f2)

          # Determine the target release version
          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.releaseVersion }}"
          else
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          fi

          # Determine the next development snapshot version
          if [ -n "${{ github.event.inputs.nextVersion }}" ]; then
            NEXT_VERSION="${{ github.event.inputs.nextVersion }}"
          else
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set Release Version and Build
        run: |
          PROP_PATH="${{ steps.context.outputs.prop_path }}"
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          BUILD_TASK="${{ steps.context.outputs.build_task }}"

          # Apply release version to target gradle.properties
          sed -i "s/^version=.*/version=${RELEASE_VERSION}/" "$PROP_PATH"
          chmod +x ./gradlew

          # If compiling the independent BOM, fetch the latest tags of all dependencies
          if [ "${{ github.event.inputs.project_type }}" = "BOM" ]; then
            API_TAG=$(git tag -l "spec-v*" | sort -V | tail -n1)
            HIB5_TAG=$(git tag -l "hib5-v*" | sort -V | tail -n1)
            HIB6_TAG=$(git tag -l "hib6-v*" | sort -V | tail -n1)

            API_VER="${API_TAG#spec-v}"
            HIB5_VER="${HIB5_TAG#hib5-v}"
            HIB6_VER="${HIB6_TAG#hib6-v}"

            echo "BOM integration resolving: API=${API_VER}, Hib5=${HIB5_VER}, Hib6=${HIB6_VER}"

            ./gradlew -p libraries $BUILD_TASK -PisBomRelease=true \
              -PreleasedApiVersion="${API_VER}" \
              -PreleasedHib5Version="${HIB5_VER}" \
              -PreleasedHib6Version="${HIB6_VER}"
          else
            ./gradlew -p libraries $BUILD_TASK
          fi

      - name: Commit and Tag Release
        run: |
          PROP_PATH="${{ steps.context.outputs.prop_path }}"
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          TAG_PREFIX="${{ steps.context.outputs.tag_prefix }}"
          PTYPE="${{ github.event.inputs.project_type }}"

          git add "$PROP_PATH"
          git commit -m "[${PTYPE} Release] - pre tag commit: '${RELEASE_VERSION}'."
          git tag -a "${TAG_PREFIX}${RELEASE_VERSION}" -m "${PTYPE} Release ${TAG_PREFIX}${RELEASE_VERSION}"

      - name: Set Next Development Version
        run: |
          PROP_PATH="${{ steps.context.outputs.prop_path }}"
          NEXT_VERSION="${{ steps.versions.outputs.next_version }}"
          PTYPE="${{ github.event.inputs.project_type }}"

          # Apply next snapshot version to target gradle.properties
          sed -i "s/^version=.*/version=${NEXT_VERSION}/" "$PROP_PATH"

          git add "$PROP_PATH"
          git commit -m "[${PTYPE} Release] - new version commit: '${NEXT_VERSION}'."

      - name: Push Changes and Tag
        run: |
          TAG_PREFIX="${{ steps.context.outputs.tag_prefix }}"
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"

          git push origin main
          git push origin "${TAG_PREFIX}${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.context.outputs.tag_prefix }}${{ steps.versions.outputs.release_version }}
          name: ${{ github.event.inputs.project_type }} Release ${{ steps.versions.outputs.release_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-libraries:
    name: Publish Libraries to Maven Central
    needs: release
    uses: ./.github/workflows/gradle-libraries-cd.yml
    with:
      tag: ${{ needs.release.outputs.tag_prefix }}${{ needs.release.outputs.release_version }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

  publish-docs:
    name: Publish Documentation
    needs: release
    uses: ./.github/workflows/gradle-libraries-doc.yml
    with:
      tag: ${{ needs.release.outputs.tag_prefix }}${{ needs.release.outputs.release_version }}
    permissions:
      contents: write
