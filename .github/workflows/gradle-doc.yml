name: Publish Documentation

on:
  workflow_call:  # Called from gradle-release.yml after a release
  workflow_dispatch:  # Allow manual triggering from the Actions tab

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7

      - name: Resolve Documentation Version
        id: version
        run: |
          # Extract version from the Git tag (e.g., v1.4.0 -> 1.4.0)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Fall back to gradle.properties for workflow_call triggers
            VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
            VERSION="${VERSION%-SNAPSHOT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Documentation version: ${VERSION}"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Documentation
        run: ./gradlew groovydocAll asciidoctor

      - name: Prepare Versioned Site
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p site/api/${VERSION}
          mkdir -p site/guide/${VERSION}

          cp -r build/docs/groovydoc/* site/api/${VERSION}/
          cp -r build/docs/asciidoc/* site/guide/${VERSION}/

          # Also publish as 'latest' for convenient access
          mkdir -p site/api/latest
          mkdir -p site/guide/latest

          cp -r build/docs/groovydoc/* site/api/latest/
          cp -r build/docs/asciidoc/* site/guide/latest/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          keep_files: true
