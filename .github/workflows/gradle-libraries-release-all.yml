name: Trigger Unified Persistence Tools Libraries Release

on:
  workflow_dispatch:
    inputs:
      apiReleaseVersion:
        description: 'Optional override for API & BOM release version (defaults to stripping -SNAPSHOT)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-libraries
  cancel-in-progress: false

jobs:
  release:
    name: Execute Unified Libraries Release Automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      api_version: ${{ steps.versions.outputs.api_version }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author Profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve Release Versions and Strip -SNAPSHOT
        id: versions
        run: |
          MODULES=(
            "persistence-tools-api"
            "hibernate-base-persistence-tools"
            "hibernate-persistence-tools"
            "hibernate-orm-persistence-tools"
            "persistence-tools-bom"
          )

          for MODULE in "${MODULES[@]}"; do
            PROP_FILE="libraries/${MODULE}/gradle.properties"
            RAW_VER=$(grep '^version=' "${PROP_FILE}" | cut -d'=' -f2)

            if [ -n "${{ github.event.inputs.apiReleaseVersion }}" ] && { [ "${MODULE}" == "persistence-tools-api" ] || [ "${MODULE}" == "persistence-tools-bom" ]; }; then
              REL_VER="${{ github.event.inputs.apiReleaseVersion }}"
            else
              REL_VER="${RAW_VER%-SNAPSHOT}"
            fi

            sed -i "s/^version=.*/version=${REL_VER}/" "${PROP_FILE}"
            echo "${MODULE} -> ${REL_VER}"
          done

          API_VERSION=$(grep '^version=' libraries/persistence-tools-api/gradle.properties | cut -d'=' -f2)
          BASE_VERSION=$(grep '^version=' libraries/hibernate-base-persistence-tools/gradle.properties | cut -d'=' -f2)
          HIB5_VERSION=$(grep '^version=' libraries/hibernate-persistence-tools/gradle.properties | cut -d'=' -f2)
          HIB6_VERSION=$(grep '^version=' libraries/hibernate-orm-persistence-tools/gradle.properties | cut -d'=' -f2)

          echo "api_version=${API_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Build and Verify All Library Modules
        working-directory: libraries
        run: |
          ../gradlew build

      - name: Commit and Tag Unified Release
        run: |
          API_VERSION="${{ steps.versions.outputs.api_version }}"
          git add libraries/*/gradle.properties
          git commit -m "[Libraries Release] - pre tag commit: 'libs-v${API_VERSION}'."
          git tag -a "libs-v${API_VERSION}" -m "Persistence Tools Libraries Release libs-v${API_VERSION}"

      - name: Increment Patch Versions and Restore -SNAPSHOT
        run: |
          MODULES=(
            "persistence-tools-api"
            "hibernate-base-persistence-tools"
            "hibernate-persistence-tools"
            "hibernate-orm-persistence-tools"
            "persistence-tools-bom"
          )

          for MODULE in "${MODULES[@]}"; do
            PROP_FILE="libraries/${MODULE}/gradle.properties"
            REL_VER=$(grep '^version=' "${PROP_FILE}" | cut -d'=' -f2)

            MAJOR=$(echo "$REL_VER" | cut -d. -f1)
            MINOR=$(echo "$REL_VER" | cut -d. -f2)
            PATCH=$(echo "$REL_VER" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VER="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"

            sed -i "s/^version=.*/version=${NEXT_VER}/" "${PROP_FILE}"
            echo "${MODULE} -> ${NEXT_VER}"
          done

          git add libraries/*/gradle.properties
          git commit -m "[Libraries Release] - new version commit."

      - name: Push Changes and Unified Tag
        run: |
          API_VERSION="${{ steps.versions.outputs.api_version }}"
          git pull --rebase origin main
          git push origin main
          git push origin "libs-v${API_VERSION}"

      - name: Extract Release Notes from libraries/CHANGELOG.md
        run: |
          API_VERSION="${{ steps.versions.outputs.api_version }}"
          awk "/^## \[?v?${API_VERSION}\]?/{flag=1; next} /^## /{flag=0} flag" libraries/CHANGELOG.md > release_notes.md
          if [ ! -s release_notes.md ]; then
            echo "Release libs-v${API_VERSION}" > release_notes.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: libs-v${{ steps.versions.outputs.api_version }}
          name: Persistence Tools Libraries libs-v${{ steps.versions.outputs.api_version }}
          body_path: release_notes.md
          draft: false
          prerelease: false
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-all:
    name: Publish All Libraries to Maven Central
    needs: release
    uses: ./.github/workflows/gradle-libraries-cd-all.yml
    with:
      tag: libs-v${{ needs.release.outputs.api_version }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
