name: Trigger Persistence Tools Platform BOM Release

on:
  workflow_dispatch:
    inputs:
      releasedApiVersion:
        description: 'Published Persistence Tools API version (e.g., 4.0.0)'
        required: false
      releasedHibernateBaseVersion:
        description: 'Published Hibernate Base version (e.g., 1.0.0)'
        required: false
      releasedHib5Version:
        description: 'Published Hibernate 5 Legacy version (e.g., 1.0.0)'
        required: false
      releasedHib6Version:
        description: 'Published Hibernate 6 Modern version (e.g., 2.0.0)'
        required: false
      releaseVersion:
        description: 'Target BOM Release Version (e.g., 4.0.0)'
        required: false
      nextVersion:
        description: 'Next BOM Snapshot Version (e.g., 4.0.1-SNAPSHOT)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-libraries
  cancel-in-progress: false

jobs:
  release:
    name: Execute Platform BOM Release Automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}
      api_version: ${{ steps.context.outputs.api_version }}
      base_version: ${{ steps.context.outputs.base_version }}
      hib5_version: ${{ steps.context.outputs.hib5_version }}
      hib6_version: ${{ steps.context.outputs.hib6_version }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author Profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve Release and Next Versions
        id: versions
        run: |
          CURRENT_VERSION=$(grep '^version=' libraries/persistence-tools-bom/gradle.properties | cut -d'=' -f2)

          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.releaseVersion }}"
          else
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          fi

          if [ -n "${{ github.event.inputs.nextVersion }}" ]; then
            NEXT_VERSION="${{ github.event.inputs.nextVersion }}"
          else
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Resolve Context and Dependency Versions
        id: context
        run: |
          if [ -n "${{ github.event.inputs.releasedApiVersion }}" ]; then
            API_VERSION="${{ github.event.inputs.releasedApiVersion }}"
          else
            API_TAG=$(git tag -l "api-v*" | sort -V | tail -n1)
            API_VERSION="${API_TAG#api-v}"
          fi

          if [ -z "${API_VERSION}" ]; then
            echo "::error::No existing 'api-v*' API release tag found and no releasedApiVersion input provided. Please release the API module first."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.releasedHibernateBaseVersion }}" ]; then
            BASE_VERSION="${{ github.event.inputs.releasedHibernateBaseVersion }}"
          else
            BASE_TAG=$(git tag -l "hibernate-base-v*" | sort -V | tail -n1)
            BASE_VERSION="${BASE_TAG#hibernate-base-v}"
          fi

          if [ -z "${BASE_VERSION}" ]; then
            echo "::error::No existing 'hibernate-base-v*' release tag found and no releasedHibernateBaseVersion input provided. Please release the Hibernate Base module first."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.releasedHib5Version }}" ]; then
            HIB5_VERSION="${{ github.event.inputs.releasedHib5Version }}"
          else
            HIB5_TAG=$(git tag -l "hibernate-v*" | sort -V | tail -n1)
            HIB5_VERSION="${HIB5_TAG#hibernate-v}"
          fi

          if [ -z "${HIB5_VERSION}" ]; then
            echo "::error::No existing 'hibernate-v*' release tag found and no releasedHib5Version input provided. Please release the Hibernate Legacy module first."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.releasedHib6Version }}" ]; then
            HIB6_VERSION="${{ github.event.inputs.releasedHib6Version }}"
          else
            HIB6_TAG=$(git tag -l "hibernate-orm-v*" | sort -V | tail -n1)
            HIB6_VERSION="${HIB6_TAG#hibernate-orm-v}"
          fi

          if [ -z "${HIB6_VERSION}" ]; then
            echo "::error::No existing 'hibernate-orm-v*' release tag found and no releasedHib6Version input provided. Please release the Hibernate Modern module first."
            exit 1
          fi

          echo "api_version=${API_VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "hib5_version=${HIB5_VERSION}" >> "$GITHUB_OUTPUT"
          echo "hib6_version=${HIB6_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Set Release Version and Build
        working-directory: libraries
        run: |
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          API_VERSION="${{ steps.context.outputs.api_version }}"
          BASE_VERSION="${{ steps.context.outputs.base_version }}"
          HIB5_VERSION="${{ steps.context.outputs.hib5_version }}"
          HIB6_VERSION="${{ steps.context.outputs.hib6_version }}"

          sed -i "s/^version=.*/version=${RELEASE_VERSION}/" persistence-tools-bom/gradle.properties

          ../gradlew :persistence-tools-bom:build \
            -PisBomRelease \
            -PreleasedApiVersion="${API_VERSION}" \
            -PreleasedHibernateBaseVersion="${BASE_VERSION}" \
            -PreleasedHib5Version="${HIB5_VERSION}" \
            -PreleasedHib6Version="${HIB6_VERSION}"

      - name: Commit and Tag Release
        run: |
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          git add libraries/persistence-tools-bom/gradle.properties
          git commit -m "[Platform BOM Release] - pre tag commit: '${RELEASE_VERSION}'."
          git tag -a "platform-v${RELEASE_VERSION}" -m "Platform BOM Release platform-v${RELEASE_VERSION}"

      - name: Set Next Development Version
        run: |
          NEXT_VERSION="${{ steps.versions.outputs.next_version }}"
          sed -i "s/^version=.*/version=${NEXT_VERSION}/" libraries/persistence-tools-bom/gradle.properties
          git add libraries/persistence-tools-bom/gradle.properties
          git commit -m "[Platform BOM Release] - new version commit: '${NEXT_VERSION}'."

      - name: Push Changes and Tag
        run: |
          git pull --rebase origin main
          git push origin main
          git push origin "platform-v${{ steps.versions.outputs.release_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: platform-v${{ steps.versions.outputs.release_version }}
          name: Persistence Tools BOM platform-v${{ steps.versions.outputs.release_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-platform:
    name: Publish Platform BOM to Maven Central
    needs: release
    uses: ./.github/workflows/gradle-libraries-cd-platform.yml
    with:
      tag: platform-v${{ needs.release.outputs.release_version }}
      releasedApiVersion: ${{ needs.release.outputs.api_version }}
      releasedHibernateBaseVersion: ${{ needs.release.outputs.base_version }}
      releasedHib5Version: ${{ needs.release.outputs.hib5_version }}
      releasedHib6Version: ${{ needs.release.outputs.hib6_version }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
