name: Publish Libraries Documentation

on:
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve Project Context and Version
        id: context
        run: |
          TARGET_REF="${{ inputs.tag || github.ref }}"
          TAG_NAME="${TARGET_REF#refs/tags/}"

          # Extract meta context according to the specific layout structure matching the tag
          if [[ "$TAG_NAME" == bom-v* ]]; then
            echo "BOM packages do not contain code api docs. Skipping generation."
            echo "skip_docs=true" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == hib6-v* ]]; then
            VERSION="${TAG_NAME#hib6-v}"
            echo "skip_docs=false" >> "$GITHUB_OUTPUT"
            echo "ptype=hibernate-orm" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "doc_task=aggregateModernHibernateJavadoc" >> "$GITHUB_OUTPUT"
            echo "src_doc_dir=libraries/build/docs/javadoc/hibernate-orm" >> "$GITHUB_OUTPUT"
          elif [[ "$TAG_NAME" == hib5-v* ]]; then
            VERSION="${TAG_NAME#hib5-v}"
            echo "skip_docs=false" >> "$GITHUB_OUTPUT"
            echo "ptype=hibernate" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "doc_task=aggregateLegacyHibernateJavadoc" >> "$GITHUB_OUTPUT"
            echo "src_doc_dir=libraries/build/docs/javadoc/hibernate" >> "$GITHUB_OUTPUT"
          else
            # Default fallback for API matching spec-v* or manual triggers
            if [[ "$TAG_NAME" == spec-v* ]]; then
              VERSION="${TAG_NAME#spec-v}"
            else
              VERSION=$(grep '^version=' libraries/gradle.properties | cut -d'=' -f2)
              VERSION="${VERSION%-SNAPSHOT}"
            fi
            echo "skip_docs=false" >> "$GITHUB_OUTPUT"
            echo "ptype=specifications" >> "$GITHUB_OUTPUT"
            echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
            echo "doc_task=aggregateApiJavadoc" >> "$GITHUB_OUTPUT"
            echo "src_doc_dir=libraries/build/docs/javadoc/specification" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Java Development Kit
        if: steps.context.outputs.skip_docs != 'true'
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        if: steps.context.outputs.skip_docs != 'true'
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        if: steps.context.outputs.skip_docs != 'true'
        run: chmod +x ./gradlew

      - name: Generate Documentation
        if: steps.context.outputs.skip_docs != 'true'
        run: ./gradlew -p libraries ${{ steps.context.outputs.doc_task }}

      - name: Prepare Versioned Site
        if: steps.context.outputs.skip_docs != 'true'
        run: |
          PTYPE="${{ steps.context.outputs.ptype }}"
          VERSION="${{ steps.context.outputs.version }}"
          SRC_DOC_DIR="${{ steps.context.outputs.src_doc_dir }}"

          # Target directory structure layout: site/tools/<ptype>/api/<version>
          TARGET_DIR="site/tools/${PTYPE}/api/${VERSION}"
          LATEST_DIR="site/tools/${PTYPE}/api/latest"

          mkdir -p "$TARGET_DIR"
          cp -r "$SRC_DOC_DIR"/* "$TARGET_DIR"/

          mkdir -p "$LATEST_DIR"
          cp -r "$TARGET_DIR"/* "$LATEST_DIR"/

      - name: Deploy to GitHub Pages
        if: steps.context.outputs.skip_docs != 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true
