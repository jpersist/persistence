name: Publish Libraries Documentation

on:
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve Project Context and Version
        id: context
        run: |
          TARGET_REF="${{ inputs.tag || github.ref }}"
          TAG_NAME="${TARGET_REF#refs/tags/}"

          # Extract meta context according to the specific layout structure matching the tag
          if [[ "$TAG_NAME" == hib6-v* ]]; then
            PTYPE="hibernate-orm"
            PROP_PATH="libraries/hibernate-orm-persistence-tools/gradle.properties"
            VERSION="${TAG_NAME#hib6-v}"
            DOC_TASK="aggregateModernHibernateJavadoc"
            SRC_DOC_DIR="libraries/build/docs/javadoc/hibernate-orm"
          elif [[ "$TAG_NAME" == hib5-v* ]]; then
            PTYPE="hibernate"
            PROP_PATH="libraries/hibernate-persistence-tools/gradle.properties"
            VERSION="${TAG_NAME#hib5-v}"
            DOC_TASK="aggregateLegacyHibernateJavadoc"
            SRC_DOC_DIR="libraries/build/docs/javadoc/hibernate"
          else
            # Default fallback for API / BOM matching spec-v* or manual triggers
            PTYPE="specifications"
            PROP_PATH="libraries/gradle.properties"
            if [[ "$TAG_NAME" == spec-v* ]]; then
              VERSION="${TAG_NAME#spec-v}"
            else
              VERSION=$(grep '^version=' "$PROP_PATH" | cut -d'=' -f2)
              VERSION="${VERSION%-SNAPSHOT}"
            fi
            DOC_TASK="aggregateApiJavadoc"
            SRC_DOC_DIR="libraries/build/docs/javadoc/specifications"
          fi

          echo "ptype=${PTYPE}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "doc_task=${DOC_TASK}" >> "$GITHUB_OUTPUT"
          echo "src_doc_dir=${SRC_DOC_DIR}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Documentation
        run: ./gradlew -p libraries ${{ steps.context.outputs.doc_task }}

      - name: Prepare Versioned Site
        run: |
          PTYPE="${{ steps.context.outputs.ptype }}"
          VERSION="${{ steps.context.outputs.version }}"
          SRC_DOC_DIR="${{ steps.context.outputs.src_doc_dir }}"

          # Target directory structure layout: site/tools/<ptype>/api/<version>
          TARGET_DIR="site/tools/${PTYPE}/api/${VERSION}"
          LATEST_DIR="site/tools/${PTYPE}/api/latest"

          mkdir -p "$TARGET_DIR"
          # Standard Gradle location for root-executed aggregate tasks
          cp -r "$SRC_DOC_DIR"/* "$TARGET_DIR"/

          mkdir -p "$LATEST_DIR"
          cp -r "$TARGET_DIR"/* "$LATEST_DIR"/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true
