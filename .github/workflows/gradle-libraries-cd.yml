name: Publish Libraries to Maven Central

on:
  push:
    # Trigger deployment only when a libraries version tag matching libs-v1.0.0, libs-v2.1.3, etc. is pushed
    tags:
      - 'libs-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish (e.g., libs-v1.0.0)'
        required: false
        type: string
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      GPG_SIGNING_KEY:
        required: true
      GPG_SIGNING_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Maven Central Publication
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        working-directory: libraries
        run: |
          # Resolve the publication version from the git tag or fall back to gradle.properties
          if [[ "${GITHUB_REF}" == refs/tags/libs-v* ]]; then
            PUBLISH_VERSION="${GITHUB_REF#refs/tags/libs-v}"
          else
            PUBLISH_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          fi
          echo "Publishing version: ${PUBLISH_VERSION}"
          ../gradlew publish -Pversion="${PUBLISH_VERSION}"
