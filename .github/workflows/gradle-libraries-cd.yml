name: Publish Libraries to Maven Central

on:
  push:
    # Trigger deployment when an authorized version tag is pushed manually or via workflow
    tags:
      - 'spec-v[0-9]+.[0-9]+.[0-9]+'
      - 'bom-v[0-9]+.[0-9]+.[0-9]+'
      - 'hib5-v[0-9]+.[0-9]+.[0-9]+'
      - 'hib6-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish'
        required: false
        type: string
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      GPG_SIGNING_KEY:
        required: true
      GPG_SIGNING_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Maven Central Publication
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        run: |
          TARGET_REF="${{ inputs.tag || github.ref }}"
          TAG_NAME="${TARGET_REF#refs/tags/}"

          # Detect module scope and resolve pure version from the active tag structure
          if [[ "$TAG_NAME" == hib6-v* ]]; then
            PUBLISH_TASK=":hibernate-orm-persistence-tools:publish"
            PROP_PATH="libraries/hibernate-orm-persistence-tools/gradle.properties"
            PUBLISH_VERSION="${TAG_NAME#hib6-v}"
          elif [[ "$TAG_NAME" == hib5-v* ]]; then
            PUBLISH_TASK=":hibernate-persistence-tools:publish"
            PROP_PATH="libraries/hibernate-persistence-tools/gradle.properties"
            PUBLISH_VERSION="${TAG_NAME#hib5-v}"
          elif [[ "$TAG_NAME" == bom-v* ]]; then
            PUBLISH_TASK=":persistence-tools-bom:publish"
            PROP_PATH="libraries/persistence-tools-bom/gradle.properties"
            PUBLISH_VERSION="${TAG_NAME#bom-v}"
          else
            # Default fallback for API matching spec-v* or manual triggers
            PUBLISH_TASK=":persistence-tools-api:publish"
            PROP_PATH="libraries/gradle.properties"
            if [[ "$TAG_NAME" == spec-v* ]]; then
              PUBLISH_VERSION="${TAG_NAME#spec-v}"
            else
              PUBLISH_VERSION=$(grep '^version=' "$PROP_PATH" | cut -d'=' -f2)
            fi
          fi

          echo "Publishing version ${PUBLISH_VERSION} via tasks: ${PUBLISH_TASK}"

          # Re-inject the dynamic versions to make sure the BOM's generated POM is written correctly
          if [[ "$TAG_NAME" == bom-v* ]]; then
            API_TAG=$(git tag -l "spec-v*" | sort -V | tail -n1)
            HIB5_TAG=$(git tag -l "hib5-v*" | sort -V | tail -n1)
            HIB6_TAG=$(git tag -l "hib6-v*" | sort -V | tail -n1)

            ./gradlew -p libraries ${PUBLISH_TASK} -Pversion="${PUBLISH_VERSION}" -PisBomRelease=true \
              -PreleasedApiVersion="${API_TAG#spec-v}" \
              -PreleasedHib5Version="${HIB5_TAG#hib5-v}" \
              -PreleasedHib6Version="${HIB6_TAG#hib6-v}"
          else
            ./gradlew -p libraries ${PUBLISH_TASK} -Pversion="${PUBLISH_VERSION}"
          fi

      - name: Finalize Maven Central Deployment
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          TOKEN=$(echo -n "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" | base64)
          curl --fail -X POST \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.jpersist?publishing_type=automatic" \
            -H "Authorization: Bearer ${TOKEN}"
