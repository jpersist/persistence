name: Trigger Persistence Tools API Release

on:
  workflow_dispatch:
    inputs:
      releaseVersion:
        description: 'Target Release Version (e.g., 4.0.0)'
        required: false
      nextVersion:
        description: 'Next Snapshot Version (e.g., 4.0.1-SNAPSHOT)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-libraries
  cancel-in-progress: false

jobs:
  release:
    name: Execute API Release Automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author Profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve Release and Next Versions
        id: versions
        run: |
          CURRENT_VERSION=$(grep '^version=' libraries/gradle.properties | cut -d'=' -f2)

          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.releaseVersion }}"
          else
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          fi

          if [ -n "${{ github.event.inputs.nextVersion }}" ]; then
            NEXT_VERSION="${{ github.event.inputs.nextVersion }}"
          else
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Set Release Version and Build
        working-directory: libraries
        run: |
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          sed -i "s/^version=.*/version=${RELEASE_VERSION}/" gradle.properties
          ../gradlew :persistence-tools-api:build

      - name: Commit and Tag Release
        run: |
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          git add libraries/gradle.properties
          git commit -m "[API Release] - pre tag commit: '${RELEASE_VERSION}'."
          git tag -a "api-v${RELEASE_VERSION}" -m "Persistence Tools API Release api-v${RELEASE_VERSION}"

      - name: Set Next Development Version
        run: |
          NEXT_VERSION="${{ steps.versions.outputs.next_version }}"
          sed -i "s/^version=.*/version=${NEXT_VERSION}/" libraries/gradle.properties
          git add libraries/gradle.properties
          git commit -m "[API Release] - new version commit: '${NEXT_VERSION}'."

      - name: Push Changes and Tag
        run: |
          git pull --rebase origin main
          git push origin main
          git push origin "api-v${{ steps.versions.outputs.release_version }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: api-v${{ steps.versions.outputs.release_version }}
          name: Persistence Tools API api-v${{ steps.versions.outputs.release_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-api:
    name: Publish API to Maven Central
    needs: release
    uses: ./.github/workflows/gradle-libraries-cd-api.yml
    with:
      tag: api-v${{ needs.release.outputs.release_version }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

  publish-docs:
    name: Publish API Documentation
    needs: release
    uses: ./.github/workflows/gradle-libraries-doc-api.yml
    with:
      tag: api-v${{ needs.release.outputs.release_version }}
    permissions:
      contents: write
