name: Publish Hibernate Persistence Tools Documentation

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to checkout and publish (e.g., libs-v4.1.0, hibernate-v1.1.0, or hibernate-orm-v2.1.0)'
        required: true
        type: string
      providerModule:
        description: 'Provider module when using a unified libs-v* tag'
        required: false
        type: string
      releasedApiVersion:
        description: 'Published Persistence Tools API version for cross-linking'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      providerModule:
        description: 'Select the Hibernate Provider module to document'
        required: true
        type: choice
        options:
          - 'hibernate-persistence-tools'
          - 'hibernate-orm-persistence-tools'
      tag:
        description: 'Release tag to checkout (defaults to latest matching libs-v* or module release tag)'
        required: false
        type: string
      releasedApiVersion:
        description: 'Optional override for Published Persistence Tools API version'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Hibernate Provider Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Tag, Target Module, and Versions
        id: context
        run: |
          ACTIVE_TAG="${{ inputs.tag || github.event.inputs.tag }}"
          SELECTED_MODULE="${{ inputs.providerModule || github.event.inputs.providerModule }}"

          if [ -z "${ACTIVE_TAG}" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            ACTIVE_TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "${ACTIVE_TAG}" ]; then
            if [ "${SELECTED_MODULE}" == "hibernate-orm-persistence-tools" ]; then
              ACTIVE_TAG=$(git tag -l "libs-v*" "hibernate-orm-v*" | sort -V | tail -n1)
            else
              ACTIVE_TAG=$(git tag -l "libs-v*" "hibernate-v*" | sort -V | tail -n1)
            fi
          fi

          if [ -z "${ACTIVE_TAG}" ]; then
            echo "::error::No release tag provided and no matching release tag found."
            exit 1
          fi

          echo "Checking out release tag: ${ACTIVE_TAG}"
          git checkout "refs/tags/${ACTIVE_TAG}"

          if [[ "${ACTIVE_TAG}" == hibernate-orm-v* ]] || [ "${SELECTED_MODULE}" == "hibernate-orm-persistence-tools" ]; then
            MODULE_DIR="hibernate-orm-persistence-tools"
            SUBFOLDER="hibernate-orm"
            TASK_NAME="aggregateModernHibernateJavadoc"
          elif [[ "${ACTIVE_TAG}" == hibernate-v* ]] || [ "${SELECTED_MODULE}" == "hibernate-persistence-tools" ]; then
            MODULE_DIR="hibernate-persistence-tools"
            SUBFOLDER="hibernate"
            TASK_NAME="aggregateLegacyHibernateJavadoc"
          else
            echo "::error::Cannot determine provider module from tag '${ACTIVE_TAG}'. Please specify providerModule."
            exit 1
          fi

          VERSION=$(grep '^version=' "libraries/${MODULE_DIR}/gradle.properties" | cut -d'=' -f2)
          VERSION="${VERSION%-SNAPSHOT}"

          if [ -n "${{ inputs.releasedApiVersion || github.event.inputs.releasedApiVersion }}" ]; then
            API_VERSION="${{ inputs.releasedApiVersion || github.event.inputs.releasedApiVersion }}"
          else
            API_VERSION=$(grep '^version=' libraries/persistence-tools-api/gradle.properties | cut -d'=' -f2)
            API_VERSION="${API_VERSION%-SNAPSHOT}"
          fi

          if [ -z "${API_VERSION}" ]; then
            echo "::error::Unable to resolve Persistence Tools API version for cross-linking."
            exit 1
          fi

          echo "subfolder=${SUBFOLDER}" >> "$GITHUB_OUTPUT"
          echo "task_name=${TASK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "api_version=${API_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Hibernate Provider Documentation
        working-directory: libraries
        run: |
          TASK_NAME="${{ steps.context.outputs.task_name }}"
          API_VERSION="${{ steps.context.outputs.api_version }}"
          ../gradlew "${TASK_NAME}" -PuseOnlineJavadoc=true -PreleasedApiVersion="${API_VERSION}"

      - name: Prepare Versioned Site
        run: |
          SUBFOLDER="${{ steps.context.outputs.subfolder }}"
          VERSION="${{ steps.context.outputs.version }}"

          mkdir -p "site/tools/${SUBFOLDER}/api/${VERSION}"
          cp -r "libraries/build/docs/javadoc/${SUBFOLDER}"/* "site/tools/${SUBFOLDER}/api/${VERSION}/"

          mkdir -p "site/tools/${SUBFOLDER}/api/latest"
          rm -rf "site/tools/${SUBFOLDER}/api/latest"/*
          cp -r "site/tools/${SUBFOLDER}/api/${VERSION}"/* "site/tools/${SUBFOLDER}/api/latest/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true
