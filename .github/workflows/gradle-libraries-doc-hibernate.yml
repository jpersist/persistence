name: Publish Hibernate Persistence Tools Documentation

on:
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish (e.g., hibernate-v1.0.0 or hibernate-orm-v2.0.0)'
        required: true
        type: string
      releasedApiVersion:
        description: 'Published Persistence Tools API version for cross-linking'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      providerModule:
        description: 'Select the Hibernate Provider module to document'
        required: true
        type: choice
        options:
          - 'hibernate-persistence-tools'
          - 'hibernate-orm-persistence-tools'

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Hibernate Provider Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve Documentation Target and Version
        id: context
        run: |
          ACTIVE_TAG="${{ inputs.tag }}"
          if [[ "${ACTIVE_TAG}" == hibernate-orm-v* ]]; then
            SUBFOLDER="hibernate-orm"
            TASK_NAME="aggregateModernHibernateJavadoc"
            VERSION="${ACTIVE_TAG#hibernate-orm-v}"
          elif [[ "${ACTIVE_TAG}" == hibernate-v* ]]; then
            SUBFOLDER="hibernate"
            TASK_NAME="aggregateLegacyHibernateJavadoc"
            VERSION="${ACTIVE_TAG#hibernate-v}"
          elif [ "${{ github.event.inputs.providerModule }}" == "hibernate-orm-persistence-tools" ]; then
            SUBFOLDER="hibernate-orm"
            TASK_NAME="aggregateModernHibernateJavadoc"
            TAG_VER=$(git tag -l "hibernate-orm-v*" | sort -V | tail -n1)
            VERSION="${TAG_VER#hibernate-orm-v}"
          else
            SUBFOLDER="hibernate"
            TASK_NAME="aggregateLegacyHibernateJavadoc"
            TAG_VER=$(git tag -l "hibernate-v*" | sort -V | tail -n1)
            VERSION="${TAG_VER#hibernate-v}"
          fi

          if [ -n "${{ inputs.releasedApiVersion }}" ]; then
            API_VERSION="${{ inputs.releasedApiVersion }}"
          else
            API_TAG=$(git tag -l "api-v*" | sort -V | tail -n1)
            API_VERSION="${API_TAG#api-v}"
          fi

          if [ -z "${API_VERSION}" ]; then
            echo "::error::No existing 'api-v*' API release tag found and no releasedApiVersion input provided. Please release the API module first."
            exit 1
          fi

          echo "subfolder=${SUBFOLDER}" >> "$GITHUB_OUTPUT"
          echo "task_name=${TASK_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "api_version=${API_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Hibernate Provider Documentation
        working-directory: libraries
        run: |
          TASK_NAME="${{ steps.context.outputs.task_name }}"
          API_VERSION="${{ steps.context.outputs.api_version }}"
          ../gradlew "${TASK_NAME}" -PuseOnlineJavadoc=true -PreleasedApiVersion="${API_VERSION}"

      - name: Prepare Versioned Site
        run: |
          SUBFOLDER="${{ steps.context.outputs.subfolder }}"
          VERSION="${{ steps.context.outputs.version }}"

          mkdir -p "site/tools/${SUBFOLDER}/api/${VERSION}"
          cp -r "libraries/build/docs/javadoc/${SUBFOLDER}"/* "site/tools/${SUBFOLDER}/api/${VERSION}/"

          mkdir -p "site/tools/${SUBFOLDER}/api/latest"
          rm -rf "site/tools/${SUBFOLDER}/api/latest"/*
          cp -r "site/tools/${SUBFOLDER}/api/${VERSION}"/* "site/tools/${SUBFOLDER}/api/latest/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true
