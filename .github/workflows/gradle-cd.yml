name: Publish Plugins to Portal

on:
  push:
    # Trigger deployment only when a version tag matching v1.0.0, v2.1.3, etc. is pushed
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    secrets:
      GRADLE_PUBLISH_KEY:
        required: true
      GRADLE_PUBLISH_SECRET:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Release Packages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Plugin Portal Publication
        env:
          GRADLE_PUBLISH_KEY: ${{ secrets.GRADLE_PUBLISH_KEY }}
          GRADLE_PUBLISH_SECRET: ${{ secrets.GRADLE_PUBLISH_SECRET }}
        run: |
          # Resolve the publication version from the git tag or fall back to gradle.properties
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            PUBLISH_VERSION="${GITHUB_REF#refs/tags/v}"
          else
            PUBLISH_VERSION=$(grep '^version=' gradle.properties | cut -d'=' -f2)
          fi
          echo "Publishing version: ${PUBLISH_VERSION}"
          ./gradlew publishPlugins -Pversion="${PUBLISH_VERSION}" --no-configuration-cache
