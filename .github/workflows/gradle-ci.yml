name: Java Gradle CI

on:
  push:
    branches: [ main ]
    # Prevent standard testing matrices from running on automated commits generated by the release plugin
    paths-ignore:
      - 'gradle.properties'
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test (JDK ${{ matrix.java-version }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # Test your plugins on the most popular modern LTS releases
        java-version: [ 17, 21 ]

    steps:
      - name: Check out Repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit
        uses: actions/setup-java@v5
        with:
          java-version: ${{ matrix.java-version }}
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # Automatically manages and reuses dependency and build caches to speed up runs
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      # Verifies tasks, bytecode enhancement, and confirms true Configuration Cache compliance
      - name: Run Build and Functional Tests
        run: ./gradlew build --configuration-cache

      # ONLY execute Sonar analysis on JDK 21 pushed to main branches or active pull requests
      - name: Analyze with Sonar
        if: matrix.java-version == 21 && (github.actor != 'dependabot[bot]')
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: ./gradlew sonar --no-configuration-cache
