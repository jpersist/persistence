name: Publish Hibernate Base Persistence Tools to Maven Central

on:
  push:
    tags:
      - 'hibernate-base-v[0-9]+.[0-9]+.[0-9]+'
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish (e.g., hibernate-base-v1.0.0)'
        required: false
        type: string
      releasedApiVersion:
        description: 'Published Persistence Tools API version to link against'
        required: false
        type: string
    secrets:
      SONATYPE_USERNAME:
        required: true
      SONATYPE_PASSWORD:
        required: true
      GPG_SIGNING_KEY:
        required: true
      GPG_SIGNING_PASSWORD:
        required: true

permissions:
  contents: read

jobs:
  publish:
    name: Publish Hibernate Base Package
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Execute Maven Central Publication
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
          GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}
        working-directory: libraries
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            PUBLISH_VERSION="${{ inputs.tag }}"
            PUBLISH_VERSION="${PUBLISH_VERSION#hibernate-base-v}"
          elif [[ "${GITHUB_REF}" == refs/tags/hibernate-base-v* ]]; then
            PUBLISH_VERSION="${GITHUB_REF#refs/tags/hibernate-base-v}"
          else
            PUBLISH_VERSION=$(grep '^version=' hibernate-base-persistence-tools/gradle.properties | cut -d'=' -f2)
          fi

          # Resolve API version from workflow input or clean snapshot suffix from local properties
          if [ -n "${{ inputs.releasedApiVersion }}" ]; then
            API_VERSION="${{ inputs.releasedApiVersion }}"
          else
            RAW_API=$(grep '^version=' gradle.properties | cut -d'=' -f2)
            API_VERSION="${RAW_API%-SNAPSHOT}"
          fi

          ../gradlew :hibernate-base-persistence-tools:publish \
            -Pversion="${PUBLISH_VERSION}" \
            -PisHibernateRelease \
            -PreleasedApiVersion="${API_VERSION}"

      - name: Finalize Maven Central Deployment
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          TOKEN=$(echo -n "${SONATYPE_USERNAME}:${SONATYPE_PASSWORD}" | base64)
          curl --fail -X POST \
            "https://ossrh-staging-api.central.sonatype.com/manual/upload/defaultRepository/io.github.jpersist?publishing_type=automatic" \
            -H "Authorization: Bearer ${TOKEN}"
