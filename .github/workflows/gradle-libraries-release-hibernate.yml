name: Trigger Hibernate Persistence Tools Release

on:
  workflow_dispatch:
    inputs:
      providerModule:
        description: 'Select the Hibernate Provider module to release'
        required: true
        type: choice
        options:
          - 'hibernate-persistence-tools'
          - 'hibernate-orm-persistence-tools'
      releasedApiVersion:
        description: 'Published Persistence Tools API version (e.g., 4.0.0)'
        required: false
      releasedHibernateBaseVersion:
        description: 'Published Hibernate Base version (e.g., 1.0.0)'
        required: false
      releaseVersion:
        description: 'Target Release Version (e.g., 1.0.0 or 2.0.0)'
        required: false
      nextVersion:
        description: 'Next Snapshot Version (e.g., 1.0.1-SNAPSHOT)'
        required: false

permissions:
  contents: write

concurrency:
  group: release-libraries
  cancel-in-progress: false

jobs:
  release:
    name: Execute Hibernate Provider Release Automation
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    outputs:
      release_version: ${{ steps.versions.outputs.release_version }}
      tag_prefix: ${{ steps.versions.outputs.tag_prefix }}
      api_version: ${{ steps.context.outputs.api_version }}
      base_version: ${{ steps.context.outputs.base_version }}

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git Author Profile
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Resolve Release Versions and Tag Prefix
        id: versions
        run: |
          MODULE="${{ github.event.inputs.providerModule }}"
          CURRENT_VERSION=$(grep '^version=' "libraries/${MODULE}/gradle.properties" | cut -d'=' -f2)

          if [ -n "${{ github.event.inputs.releaseVersion }}" ]; then
            RELEASE_VERSION="${{ github.event.inputs.releaseVersion }}"
          else
            RELEASE_VERSION="${CURRENT_VERSION%-SNAPSHOT}"
          fi

          if [ -n "${{ github.event.inputs.nextVersion }}" ]; then
            NEXT_VERSION="${{ github.event.inputs.nextVersion }}"
          else
            MAJOR=$(echo "$RELEASE_VERSION" | cut -d. -f1)
            MINOR=$(echo "$RELEASE_VERSION" | cut -d. -f2)
            PATCH=$(echo "$RELEASE_VERSION" | cut -d. -f3)
            NEXT_PATCH=$((PATCH + 1))
            NEXT_VERSION="${MAJOR}.${MINOR}.${NEXT_PATCH}-SNAPSHOT"
          fi

          if [ "${MODULE}" == "hibernate-orm-persistence-tools" ]; then
            TAG_PREFIX="hibernate-orm-v"
            COMMIT_MESSAGE_PREFIX="Hibernate Modern"
            RELEASE_TITLE_PREFIX="Hibernate Modern Persistence Tools"
          else
            TAG_PREFIX="hibernate-v"
            COMMIT_MESSAGE_PREFIX="Hibernate Legacy"
            RELEASE_TITLE_PREFIX="Hibernate Legacy Persistence Tools"
          fi

          echo "release_version=${RELEASE_VERSION}" >> "$GITHUB_OUTPUT"
          echo "next_version=${NEXT_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag_prefix=${TAG_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "commit_message_prefix=${COMMIT_MESSAGE_PREFIX}" >> "$GITHUB_OUTPUT"
          echo "release_title_prefix=${RELEASE_TITLE_PREFIX}" >> "$GITHUB_OUTPUT"

      - name: Resolve Context and Dependency Versions
        id: context
        run: |
          if [ -n "${{ github.event.inputs.releasedApiVersion }}" ]; then
            API_VERSION="${{ github.event.inputs.releasedApiVersion }}"
          else
            API_TAG=$(git tag -l "api-v*" | sort -V | tail -n1)
            API_VERSION="${API_TAG#api-v}"
          fi

          if [ -z "${API_VERSION}" ]; then
            echo "::error::No existing 'api-v*' API release tag found and no releasedApiVersion input provided. Please release the API module first."
            exit 1
          fi

          if [ -n "${{ github.event.inputs.releasedHibernateBaseVersion }}" ]; then
            BASE_VERSION="${{ github.event.inputs.releasedHibernateBaseVersion }}"
          else
            BASE_TAG=$(git tag -l "hibernate-base-v*" | sort -V | tail -n1)
            BASE_VERSION="${BASE_TAG#hibernate-base-v}"
          fi

          if [ -z "${BASE_VERSION}" ]; then
            echo "::error::No existing 'hibernate-base-v*' release tag found and no releasedHibernateBaseVersion input provided. Please release the Hibernate Base module first."
            exit 1
          fi

          echo "api_version=${API_VERSION}" >> "$GITHUB_OUTPUT"
          echo "base_version=${BASE_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Set Release Version and Build
        working-directory: libraries
        run: |
          MODULE="${{ github.event.inputs.providerModule }}"
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          API_VERSION="${{ steps.context.outputs.api_version }}"
          BASE_VERSION="${{ steps.context.outputs.base_version }}"

          sed -i "s/^version=.*/version=${RELEASE_VERSION}/" "${MODULE}/gradle.properties"

          ../gradlew ":${MODULE}:build" \
            -PisHibernateRelease \
            -PreleasedApiVersion="${API_VERSION}" \
            -PreleasedHibernateBaseVersion="${BASE_VERSION}"

      - name: Commit and Tag Release
        run: |
          MODULE="${{ github.event.inputs.providerModule }}"
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          TAG_PREFIX="${{ steps.versions.outputs.tag_prefix }}"
          COMMIT_MESSAGE_PREFIX="${{ steps.versions.outputs.commit_message_prefix }}"

          git add "libraries/${MODULE}/gradle.properties"
          git commit -m "[${COMMIT_MESSAGE_PREFIX} Release] - pre tag commit: '${RELEASE_VERSION}'."
          git tag -a "${TAG_PREFIX}${RELEASE_VERSION}" -m "Release ${TAG_PREFIX}${RELEASE_VERSION}"

      - name: Set Next Development Version
        run: |
          MODULE="${{ github.event.inputs.providerModule }}"
          NEXT_VERSION="${{ steps.versions.outputs.next_version }}"
          COMMIT_MESSAGE_PREFIX="${{ steps.versions.outputs.commit_message_prefix }}"

          sed -i "s/^version=.*/version=${NEXT_VERSION}/" "libraries/${MODULE}/gradle.properties"
          git add "libraries/${MODULE}/gradle.properties"
          git commit -m "[${COMMIT_MESSAGE_PREFIX} Release] - new version commit: '${NEXT_VERSION}'."

      - name: Push Changes and Tag
        run: |
          TAG_PREFIX="${{ steps.versions.outputs.tag_prefix }}"
          RELEASE_VERSION="${{ steps.versions.outputs.release_version }}"
          git pull --rebase origin main
          git push origin main
          git push origin "${TAG_PREFIX}${RELEASE_VERSION}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.versions.outputs.tag_prefix }}${{ steps.versions.outputs.release_version }}
          name: ${{ steps.versions.outputs.release_title_prefix }} ${{ steps.versions.outputs.tag_prefix }}${{ steps.versions.outputs.release_version }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-hibernate:
    name: Publish Hibernate Provider to Maven Central
    needs: release
    uses: ./.github/workflows/gradle-libraries-cd-hibernate.yml
    with:
      tag: ${{ needs.release.outputs.tag_prefix }}${{ needs.release.outputs.release_version }}
      releasedApiVersion: ${{ needs.release.outputs.api_version }}
      releasedHibernateBaseVersion: ${{ needs.release.outputs.base_version }}
    secrets:
      SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
      SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
      GPG_SIGNING_KEY: ${{ secrets.GPG_SIGNING_KEY }}
      GPG_SIGNING_PASSWORD: ${{ secrets.GPG_SIGNING_PASSWORD }}

  publish-docs:
    name: Publish Hibernate Provider Documentation
    needs: release
    uses: ./.github/workflows/gradle-libraries-doc-hibernate.yml
    with:
      tag: ${{ needs.release.outputs.tag_prefix }}${{ needs.release.outputs.release_version }}
      releasedApiVersion: ${{ needs.release.outputs.api_version }}
    permissions:
      contents: write
