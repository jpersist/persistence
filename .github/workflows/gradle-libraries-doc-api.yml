name: Publish Persistence Tools API Documentation

on:
  workflow_call:
    inputs:
      tag:
        description: 'The version tag to checkout and publish (e.g., api-v4.0.0)'
        required: false
        type: string
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: Resolve Documentation Version
        id: version
        run: |
          if [ -n "${{ inputs.tag }}" ]; then
            VERSION="${{ inputs.tag }}"
            VERSION="${VERSION#api-v}"
          elif [[ "${GITHUB_REF}" == refs/tags/api-v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/api-v}"
          else
            VERSION=$(grep '^version=' libraries/gradle.properties | cut -d'=' -f2)
            VERSION="${VERSION%-SNAPSHOT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate API Documentation
        working-directory: libraries
        run: ../gradlew aggregateApiJavadoc

      - name: Prepare Versioned Site
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          # Publish to site/tools/specifications/api/{version} matching cross-reference links
          mkdir -p "site/tools/specifications/api/${VERSION}"
          cp -r libraries/build/docs/javadoc/specifications/* "site/tools/specifications/api/${VERSION}/"

          mkdir -p "site/tools/specifications/api/latest"
          rm -rf site/tools/specifications/api/latest/*
          cp -r "site/tools/specifications/api/${VERSION}"/* "site/tools/specifications/api/latest/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true
