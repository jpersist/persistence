name: Publish Persistence Tools API Documentation

on:
  workflow_call:
    inputs:
      tag:
        description: 'Release tag to checkout and publish (e.g., libs-v4.1.0 or api-v4.1.0)'
        required: false
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to checkout and publish (defaults to latest libs-v* or api-v* tag)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy API Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository History
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve Release Tag and Checkout
        id: release_tag
        run: |
          TARGET_TAG="${{ inputs.tag || github.event.inputs.tag }}"

          if [ -z "${TARGET_TAG}" ] && [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TARGET_TAG="${GITHUB_REF#refs/tags/}"
          fi

          if [ -z "${TARGET_TAG}" ]; then
            TARGET_TAG=$(git tag -l "libs-v*" "api-v*" | sort -V | tail -n1)
          fi

          if [ -z "${TARGET_TAG}" ]; then
            echo "::error::No release tag provided and no existing 'libs-v*' or 'api-v*' tag found."
            exit 1
          fi

          echo "Checking out release tag: ${TARGET_TAG}"
          git checkout "refs/tags/${TARGET_TAG}"

          VERSION=$(grep '^version=' libraries/persistence-tools-api/gradle.properties | cut -d'=' -f2)
          VERSION="${VERSION%-SNAPSHOT}"

          echo "tag=${TARGET_TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate API Documentation
        working-directory: libraries
        run: ../gradlew aggregateApiJavadoc

      - name: Prepare Versioned Site
        run: |
          VERSION="${{ steps.release_tag.outputs.version }}"

          # Publish to site/tools/specifications/api/{version} matching cross-reference links
          mkdir -p "site/tools/specifications/api/${VERSION}"
          cp -r libraries/build/docs/javadoc/specifications/* "site/tools/specifications/api/${VERSION}/"

          mkdir -p "site/tools/specifications/api/latest"
          rm -rf site/tools/specifications/api/latest/*
          cp -r "site/tools/specifications/api/${VERSION}"/* "site/tools/specifications/api/latest/"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true
