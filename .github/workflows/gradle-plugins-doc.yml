name: Publish Plugins Documentation

on:
  workflow_call:  # Called from gradle-plugins-release.yml after a release
    inputs:
      tag:
        description: 'The version tag to checkout and publish (e.g., v1.0.0)'
        required: false
        type: string
  workflow_dispatch:  # Allow manual triggering from the Actions tab

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Documentation to GitHub Pages
    runs-on: ubuntu-latest

    steps:
      - name: Check out Repository
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Resolve Documentation Version
        id: version
        run: |
          # Extract version from the Git tag (e.g., v1.4.0 -> 1.4.0)
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            # Fall back to plugins/gradle.properties for workflow_call triggers
            VERSION=$(grep '^version=' plugins/gradle.properties | cut -d'=' -f2)
            VERSION="${VERSION%-SNAPSHOT}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Documentation version: ${VERSION}"

      - name: Set up Java Development Kit
        uses: actions/setup-java@v6
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./gradlew

      - name: Generate Documentation
        working-directory: plugins
        run: ../gradlew groovydocAll asciidoctor

      - name: Prepare Versioned Site
        run: |
          VERSION="${{ steps.version.outputs.version }}"

          mkdir -p site/plugins/api/${VERSION}
          mkdir -p site/plugins/guide/${VERSION}

          cp -r plugins/build/docs/groovydoc/* site/plugins/api/${VERSION}/
          cp -r plugins/build/docs/asciidoc/* site/plugins/guide/${VERSION}/

          # Also publish as 'latest' for convenient access
          mkdir -p site/plugins/api/latest
          mkdir -p site/plugins/guide/latest

          cp -r site/plugins/api/${VERSION}/* site/plugins/api/latest/
          cp -r site/plugins/guide/${VERSION}/* site/plugins/guide/latest/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./site
          destination_dir: .
          keep_files: true
