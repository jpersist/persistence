pluginManagement {
    repositories {
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'com.gradle.develocity' version '4.6.1'
}

develocity {
    buildScan {
        publishing.onlyIf { System.getenv('CI') != null }

        termsOfUseUrl = 'https://gradle.com/help/legal-terms-of-use'
        termsOfUseAgree = 'yes'
    }
}

rootProject.name = 'jpersist'

includeBuild 'libraries'
includeBuild 'plugins'
